    gap: 16px; padding: 24px;

    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);

  svg { display: block; width: 100%; height: auto; }
  p.tip { color: #8fa1bd; font-size: 13px; letter-spacing: .06em; }

  /* 太阳光芒缓慢旋转 */
  #sunRays { transform-origin: 95px 95px; animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 掠过的速度线 */
  .speedline { opacity: 0; animation: whoosh 1s linear infinite; }
  .s2 { animation-delay: .33s; }
  .s3 { animation-delay: .66s; }
  @keyframes whoosh {
    0%   { transform: translateX(90px);  opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateX(-150px); opacity: 0; }
  }

  /* 篮子里的小鱼甩尾巴 */

  #fishtail2 { transform-origin: 336px 305px; animation: wiggle .7s ease-in-out .1s infinite alternate-reverse; }
  @keyframes wiggle { from { transform: rotate(-9deg); } to { transform: rotate(10deg); } }

  @media (prefers-reduced-motion: reduce) {
    #sunRays, .speedline, #fishtail1, #fishtail2 { animation: none; }
    .speedline { opacity: .3; }
  }
</style>

<p class="tip">SVG 绘制 · 车轮/曲柄旋转 + 双腿逆运动学踩踏 · 云与路景视差滚动 · 调试：URL 加 <code>?t=1.7</code> 可定格任意时刻</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;

  // ---- 几何配置（与 SVG 坐标一一对应）----
  const BB = { x: 440, y: 430 };            // 五通：曲柄轴心
  const CRANK = 45;                          // 曲柄长度
  const WHEEL_R = 95;                        // 车轮半径
  const WHEEL_T = 2.0;                       // 车轮转一圈的秒数
  const CRANK_T = 3.4;                       // 脚踏转一圈的秒数
  const ROAD_V = TAU * WHEEL_R / WHEEL_T;    // 路面后移速度 ≈ 298 px/s

  const HIPS = { Near: { x: 416, y: 248 }, Far: { x: 402, y: 252 } };
  const THIGH = 127, SHIN = 120;             // 大腿 / 小腿长度

  const el = {
    spokesR: $('spokesR'), spokesF: $('spokesF'),
    crankNear: $('crankNear'), pedalNear: $('pedalNear'),
    crankFar: $('crankFar'), pedalFar: $('pedalFar'),
    thighNear: $('thighNear'), shinNear: $('shinNear'),
    thighFar: $('thighFar'), shinFar: $('shinFar'),
    footNear: $('footNear'), footFar: $('footFar'),
    rider: $('rider'), wing: $('wing'),
    roadDash: $('roadDash'), chainTop: $('chainTop'), chainBot: $('chainBot'),
    shadow: $('shadow'),
    scrollers: [...document.querySelectorAll('.scroll')],
  };

  // 两段式逆运动学：已知髋与踝，求膝盖。
  // 膝盖取偏向前方（+x）的那个解，符合骑车时膝盖朝前的姿态。
  function solveKnee(hip, ankle, L1, L2) {
    let dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L1 - L2) + 2), L1 + L2 - 2);
    const a = (L1 * L1 + d * d - L2 * L2) / (2 * d);   // 髋沿髋-踝方向到膝的距离
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a)); // 膝到该连线的垂距
    const ux = dx / d, uy = dy / d;
    return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
  }

  function setLine(l, x1, y1, x2, y2) {
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  }

  function render(t) {
    const wa = TAU * t / WHEEL_T;   // 车轮角度
    const ca = TAU * t / CRANK_T;   // 曲柄角度
    const deg = r => (r * 180 / Math.PI).toFixed(2);

    el.spokesR.setAttribute('transform', `rotate(${deg(wa)} 300 430)`);
    el.spokesF.setAttribute('transform', `rotate(${deg(wa)} 620 430)`);

    // 双曲柄相差 180°，踏板始终保持水平
    const pn = { x: BB.x + CRANK * Math.cos(ca), y: BB.y + CRANK * Math.sin(ca) };
    const pf = { x: BB.x - CRANK * Math.cos(ca), y: BB.y - CRANK * Math.sin(ca) };
    setLine(el.crankNear, BB.x, BB.y, pn.x, pn.y);
    setLine(el.crankFar,  BB.x, BB.y, pf.x, pf.y);
    el.pedalNear.setAttribute('x', pn.x - 13); el.pedalNear.setAttribute('y', pn.y - 4);
    el.pedalFar.setAttribute('x',  pf.x - 13); el.pedalFar.setAttribute('y',  pf.y - 4);

    // 腿：髋固定在腹下，踝追着踏板上沿走，膝盖用 IK 求出
    for (const [side, hip, pedal] of [['Near', HIPS.Near, pn], ['Far', HIPS.Far, pf]]) {
      const ankle = { x: pedal.x - 2, y: pedal.y - 13 };
      const k = solveKnee(hip, ankle, THIGH, SHIN);
      setLine(el['thigh' + side], hip.x, hip.y, k.x, k.y);
      setLine(el['shin' + side], k.x, k.y, ankle.x, ankle.y);
      el['foot' + side].setAttribute('transform', `translate(${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)})`);
    }

    // 路面虚线与链条随速度滚动
    el.roadDash.setAttribute('stroke-dashoffset', ((ROAD_V * t) % 100).toFixed(1));
    const off = ((ROAD_V * t * 0.55) % 10).toFixed(2);
    el.chainTop.setAttribute('stroke-dashoffset', off);
    el.chainBot.setAttribute('stroke-dashoffset', -off);

    // 身体随踩踏节奏轻微起伏，翅膀轻摆，影子微缩
    const bob = 2.2 * Math.sin(2 * ca);
    el.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    el.wing.setAttribute('transform', `rotate(${(3 * Math.sin(ca)).toFixed(2)} 448 180)`);
    el.shadow.setAttribute('rx', (258 - 3 * Math.sin(2 * ca)).toFixed(1));

    // 背景元素循环横移（云慢、路边植物与车速一致，形成视差）
    for (const g of el.scrollers) {
      const s = +g.dataset.speed, w = +g.dataset.w, x0 = +g.dataset.x;
      const x = ((x0 - s * t) % w + w) % w - 150;
      g.setAttribute('transform', `translate(${x.toFixed(1)} ${g.dataset.y})`);
    }
  }

  // ?t=秒数 → 定格调试；系统开启"减少动态效果"时只画一帧
  const qp = new URLSearchParams(location.search).get('t');
  if (qp !== null) {
    render(parseFloat(qp) || 0);
  } else if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    render(0.9);
  } else {
    let t0;
    const loop = ts => {
      if (t0 === undefined) t0 = ts;
      render((ts - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
