  <g transform="translate(450 388)">

  <g stroke-linecap="round">

  <g transform="translate(450 388)">

      <g id="pedalN">

  <path id="legNO" d="" fill="none" stroke="#8a5a20" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <g id="bird">

    <path d="M 500 210 C 520 190 531 163 537 138" fill="none" stroke="#faf6ec" stroke-width="24" stroke-linecap="round"/>
    <path d="M 336 234 L 312 222 L 332 240 L 308 238 L 334 248 L 316 254 L 340 250 Z" fill="#e8e0cc" stroke="#d9cfb5" stroke-width="2"/>
    <path d="M 336 234 C 344 208 388 182 442 178 C 484 175 512 190 524 214 C 534 234 528 256 502 262 C 468 271 424 270 398 262 C 372 254 340 250 336 234 Z" fill="#faf6ec" stroke="#d9cfb5" stroke-width="3"/>
    <ellipse cx="460" cy="252" rx="58" ry="9" fill="#ece2c8" opacity=".6"/>
    <g id="wingG">
      <path d="M 458 196 C 492 198 518 218 536 240 C 542 248 538 256 528 254 C 496 258 462 246 452 226 C 446 212 448 197 458 196 Z" fill="#f0e7d1" stroke="#d9cfb5" stroke-width="3"/>

        <path d="M 568 120 C 576 148 606 158 638 141 C 644 138 647 134 645 131 C 620 140 590 142 568 120 Z" fill="#ef9540" stroke="#c98a2e" stroke-width="2"/>
        <path d="M 578 138 C 596 148 616 148 632 138" fill="none" stroke="#f7b267" stroke-width="2" opacity=".8"/>

    <g id="eyeG">

  <script><![CDATA[
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var BB = { x: 450, y: 388 }, CR = 36;
    var HIP_N = { x: 402, y: 258 }, HIP_F = { x: 414, y: 260 };
    var TH = 88, SH = 88;
    var GS = 430, CAD = Math.PI * 2 * 0.9, CHS = 24 * CAD;
    var slow = (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0.25 : 1;

    var t = 0, crank = 0.6, wheel = 0;
    var roadPh = 0, cloudPh = 0, farPh = 0, nearPh = 0, chainPh = 0;

    function setT(el, s) { el.setAttribute('transform', s); }

    function legD(hip, foot) {
      var dx = foot.x - hip.x, dy = foot.y - hip.y;
      var d = Math.hypot(dx, dy) || 1;
      var dc = Math.min(d, TH + SH - 0.5);
      var a = (TH * TH - SH * SH + dc * dc) / (2 * dc);
      var h = Math.sqrt(Math.max(0, TH * TH - a * a));
      var mx = hip.x + dx * (a / d), my = hip.y + dy * (a / d);
      var kx = mx + (dy / d) * h, ky = my - (dx / d) * h;
      if (kx < mx) { kx = mx - (dy / d) * h; ky = my + (dx / d) * h; }
      return 'M ' + hip.x + ' ' + hip.y + ' L ' + kx.toFixed(1) + ' ' + ky.toFixed(1) +
             ' L ' + foot.x.toFixed(1) + ' ' + foot.y.toFixed(1);
    }

    function update(dt) {
      t += dt;
      crank += CAD * dt;
      wheel += (GS / 56) * dt;
      roadPh = (roadPh + GS * dt) % 1200;
      cloudPh = (cloudPh + 14 * dt) % 1200;
      farPh = (farPh + 46 * dt) % 1200;
      nearPh = (nearPh + 95 * dt) % 1200;
      chainPh = (chainPh + CHS * dt) % 10;

      var cd = crank * 180 / Math.PI;
      var wd = wheel * 180 / Math.PI;

      setT($('crankN'), 'rotate(' + cd.toFixed(2) + ')');
      setT($('pedalN'), 'translate(36 0) rotate(' + (-cd).toFixed(2) + ')');
      setT($('crankF'), 'rotate(' + (cd + 180).toFixed(2) + ')');
      setT($('pedalF'), 'translate(36 0) rotate(' + (-(cd + 180)).toFixed(2) + ')');
      setT($('spinR'), 'rotate(' + wd.toFixed(2) + ')');
      setT($('spinF'), 'rotate(' + wd.toFixed(2) + ')');

      setT($('cloudsG'), 'translate(' + (-cloudPh).toFixed(1) + ' 0)');
      setT($('hillsFarG'), 'translate(' + (-farPh).toFixed(1) + ' 0)');
      setT($('hillsNearG'), 'translate(' + (-nearPh).toFixed(1) + ' 0)');
      setT($('postsG'), 'translate(' + (-roadPh).toFixed(1) + ' 0)');
      $('roadDash').setAttribute('stroke-dashoffset', (-(roadPh % 74)).toFixed(1));
      $('chainT').setAttribute('stroke-dashoffset', (-chainPh).toFixed(2));
      $('chainB').setAttribute('stroke-dashoffset', (chainPh).toFixed(2));
      setT($('raysG'), 'rotate(' + (t * 3).toFixed(2) + ' 110 92)');

      var pn = { x: BB.x + CR * Math.cos(crank), y: BB.y + CR * Math.sin(crank) };
      var pf = { x: BB.x - CR * Math.cos(crank), y: BB.y - CR * Math.sin(crank) };
      var dn = legD(HIP_N, pn), df = legD(HIP_F, pf);
      $('legN').setAttribute('d', dn);
      $('legNO').setAttribute('d', dn);
      $('legF').setAttribute('d', df);
      $('legFO').setAttribute('d', df);
      setT($('footN'), 'translate(' + pn.x.toFixed(1) + ' ' + (pn.y - 11).toFixed(1) + ') rotate(' + (10 * Math.sin(crank)).toFixed(1) + ')');
      setT($('footF'), 'translate(' + pf.x.toFixed(1) + ' ' + (pf.y - 11).toFixed(1) + ') rotate(' + (10 * Math.sin(crank + Math.PI)).toFixed(1) + ')');

      var bob = 2.2 * Math.sin(2 * crank);
      var rock = 1.1 * Math.sin(2 * crank + 0.7);
      setT($('bird'), 'translate(0 ' + bob.toFixed(2) + ') rotate(' + rock.toFixed(2) + ' 420 252)');
      setT($('wingG'), 'rotate(' + (4 * Math.sin(2 * crank + 1.5)).toFixed(2) + ' 460 200)');
      setT($('pouchG'), 'rotate(' + (2.5 * Math.sin(2 * crank + 2.6)).toFixed(2) + ' 568 120)');
      setT($('fishG'), 'translate(629 146) rotate(' + (30 + 14 * Math.sin(5 * t)).toFixed(1) + ')');

      var bl = (t % 3.7) < 0.13 ? 0.12 : 1;
      setT($('eyeG'), 'translate(558 114) scale(1 ' + bl + ') translate(-558 -114)');
    }

    var last = 0;
    function frame(ts) {
      if (!last) last = ts;
      var dt = Math.min(0.05, (ts - last) / 1000) * slow;
      last = ts;
      update(dt);
      requestAnimationFrame(frame);
    }
    update(0);
    requestAnimationFrame(frame);
  })();
  ]]></script>
