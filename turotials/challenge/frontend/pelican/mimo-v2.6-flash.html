<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, #1d2a3d, #0c1220 70%);
    font-family:system-ui,sans-serif;
  }
  .stage {
    width:min(96vw, 960px);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.08);
  }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
<title>鹈鹕骑自行车</title>
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a3dcff"/>
    <stop offset="0.6" stop-color="#cfeeff"/>
    <stop offset="1" stop-color="#eaf8ff"/>
  </linearGradient>

  <g id="cloudA">
    <ellipse cx="0" cy="0" rx="44" ry="18"/>
    <ellipse cx="34" cy="-13" rx="28" ry="15"/>
    <ellipse cx="-30" cy="-7" rx="24" ry="13"/>
  </g>
  <g id="cloudB">
    <ellipse cx="0" cy="0" rx="56" ry="22"/>
    <ellipse cx="42" cy="-16" rx="34" ry="18"/>
    <ellipse cx="-38" cy="-9" rx="30" ry="16"/>
  </g>

  <path id="hillF" d="M 0,356 Q 120,300 240,340 Q 360,380 480,315 Q 600,255 720,330 Q 770,360 800,356 L 800,430 L 0,430 Z" fill="#cbe9c0"/>
  <path id="hillN" d="M 0,356 Q 160,318 320,348 Q 480,378 640,326 Q 730,300 800,356 L 800,430 L 0,430 Z" fill="#a8d896"/>

  <g id="scenery">
    <rect x="55" y="394" width="10" height="47" rx="3" fill="#8d6e63"/>
    <circle cx="60" cy="380" r="26" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="39" cy="396" r="17" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="81" cy="396" r="17" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>

    <g fill="#63b855">
      <ellipse cx="170" cy="424" rx="27" ry="16"/>
      <ellipse cx="150" cy="431" rx="16" ry="10"/>
      <ellipse cx="190" cy="431" rx="16" ry="10"/>
    </g>

    <path d="M 240,440 l5,-14 l5,14 M 254,440 l4,-10 l4,10" stroke="#4f9e47" stroke-width="4" fill="none" stroke-linecap="round"/>

    <g fill="#4f9e47">
      <ellipse cx="320" cy="426" rx="24" ry="15"/>
      <ellipse cx="303" cy="432" rx="15" ry="9"/>
      <ellipse cx="337" cy="432" rx="15" ry="9"/>
    </g>

    <path d="M 380,440 v-12 M 396,440 v-9" stroke="#4f9e47" stroke-width="3"/>
    <circle cx="380" cy="424" r="6" fill="#ffd166" stroke="#e8a93c" stroke-width="2"/>
    <circle cx="396" cy="427" r="5" fill="#ef5b3e" stroke="#c9452c" stroke-width="2"/>

    <rect x="466" y="404" width="8" height="37" rx="3" fill="#8d6e63"/>
    <circle cx="470" cy="394" r="20" fill="#63b855" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="454" cy="406" r="13" fill="#63b855" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="486" cy="406" r="13" fill="#63b855" stroke="#2f7a38" stroke-width="3"/>

    <g fill="#63b855">
      <ellipse cx="560" cy="425" rx="26" ry="15"/>
      <ellipse cx="541" cy="431" rx="15" ry="9"/>
      <ellipse cx="579" cy="431" rx="15" ry="9"/>
    </g>

    <path d="M 620,440 l5,-13 l5,13 M 636,440 l4,-9 l4,9" stroke="#4f9e47" stroke-width="4" fill="none" stroke-linecap="round"/>

    <rect x="695" y="398" width="10" height="43" rx="3" fill="#8d6e63"/>
    <circle cx="700" cy="386" r="24" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="680" cy="400" r="16" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>
    <circle cx="720" cy="400" r="16" fill="#4f9e47" stroke="#2f7a38" stroke-width="3"/>
  </g>
</defs>
  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="360" fill="url(#skyG)"/>

  <!-- 太阳 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 95 75" to="360 95 75" dur="40s" repeatCount="indefinite"/>
    <g stroke="#ffb84d" stroke-width="5" stroke-linecap="round">
      <line x1="95" y1="27" x2="95" y2="11"/>
      <line x1="95" y1="123" x2="95" y2="139"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(45 95 75)"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(90 95 75)"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(135 95 75)"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(225 95 75)"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(270 95 75)"/>
      <line x1="95" y1="27" x2="95" y2="11" transform="rotate(315 95 75)"/>
    </g>
    <circle cx="95" cy="75" r="34" fill="#ffd166"/>
  </g>

  <!-- 飞鸟 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="860 62; -80 62" dur="17s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; -8 0 0; 0 0 0; 8 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" repeatCount="indefinite"/>
      <path d="M -15,0 q 7.5,-9 15,0 q 7.5,-9 15,0" stroke="#455a64" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 128; -80 152" dur="23s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; -7 0 0; 0 0 0; 7 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.75s" repeatCount="indefinite"/>
      <path d="M -12,0 q 6,-7 12,0 q 6,-7 12,0" stroke="#5b7080" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 云层(两层视差) -->
  <g fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="60s" repeatCount="indefinite"/>
    <use href="#cloudA" x="120" y="72"/>
    <use href="#cloudA" x="400" y="54"/>
    <use href="#cloudA" x="660" y="88"/>
    <use href="#cloudA" x="920" y="72"/>
    <use href="#cloudA" x="1200" y="54"/>
    <use href="#cloudA" x="1460" y="88"/>
  </g>
  <g fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="34s" repeatCount="indefinite"/>
    <use href="#cloudB" x="180" y="152"/>
    <use href="#cloudB" x="500" y="166"/>
    <use href="#cloudB" x="740" y="142"/>
    <use href="#cloudB" x="980" y="152"/>
    <use href="#cloudB" x="1300" y="166"/>
    <use href="#cloudB" x="1540" y="142"/>
  </g>

  <!-- 远山 / 近山 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="16s" repeatCount="indefinite"/>
    <use href="#hillF"/>
    <use href="#hillF" x="800"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="9s" repeatCount="indefinite"/>
    <use href="#hillN"/>
    <use href="#hillN" x="800"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="350" width="800" height="90" fill="#7cc35a"/>
  <rect x="0" y="420" width="800" height="20" fill="#6ab14e"/>

  <!-- 树木灌木(快速滚动) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="2.333s" repeatCount="indefinite"/>
    <use href="#scenery"/>
    <use href="#scenery" x="800"/>
  </g>

  <!-- 马路 -->
  <rect x="0" y="440" width="800" height="80" fill="#59616e"/>
  <rect x="0" y="440" width="800" height="4" fill="#414855"/>
  <rect x="0" y="512" width="800" height="8" fill="#414855"/>
  <g fill="#f4f6fa" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; -80 0" dur="0.233s" repeatCount="indefinite"/>
    <rect x="0" y="474" width="44" height="7" rx="3.5"/>
    <rect x="80" y="474" width="44" height="7" rx="3.5"/>
    <rect x="160" y="474" width="44" height="7" rx="3.5"/>
    <rect x="240" y="474" width="44" height="7" rx="3.5"/>
    <rect x="320" y="474" width="44" height="7" rx="3.5"/>
    <rect x="400" y="474" width="44" height="7" rx="3.5"/>
    <rect x="480" y="474" width="44" height="7" rx="3.5"/>
    <rect x="560" y="474" width="44" height="7" rx="3.5"/>
    <rect x="640" y="474" width="44" height="7" rx="3.5"/>
    <rect x="720" y="474" width="44" height="7" rx="3.5"/>
    <rect x="800" y="474" width="44" height="7" rx="3.5"/>
    <rect x="880" y="474" width="44" height="7" rx="3.5"/>
    <rect x="960" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1040" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1120" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1200" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1280" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1360" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1440" y="474" width="44" height="7" rx="3.5"/>
    <rect x="1520" y="474" width="44" height="7" rx="3.5"/>
  </g>

  <!-- 后轮扬尘 -->
  <g fill="#cfd6de">
    <circle cx="238" cy="430" r="10" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -14" dur="1s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6; 0" dur="1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="436" r="8" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -14" dur="1s" begin="-0.33s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55; 0" dur="1s" begin="-0.33s" repeatCount="indefinite"/>
    </circle>
    <circle cx="208" cy="440" r="7" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="0 0; -70 -14" dur="1s" begin="-0.66s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5; 0" dur="1s" begin="-0.66s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 风速线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0 0; -1000 0" dur="2.9s" repeatCount="indefinite"/>
    <line x1="0" y1="372" x2="80" y2="372"/>
    <line x1="250" y1="404" x2="350" y2="404"/>
    <line x1="500" y1="386" x2="570" y2="386"/>
    <line x1="750" y1="424" x2="860" y2="424"/>
    <line x1="1000" y1="372" x2="1080" y2="372"/>
    <line x1="1250" y1="404" x2="1350" y2="404"/>
    <line x1="1500" y1="386" x2="1570" y2="386"/>
    <line x1="1750" y1="424" x2="1860" y2="424"/>
  </g>
  <!-- 远侧腿 -->
  <g transform="translate(-10,3)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-18.4 338 258; 17.2 338 258; -23.7 338 258; -62.2 338 258; -18.4 338 258" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" begin="-0.55s" repeatCount="indefinite"/>
      <line x1="338" y1="258" x2="369.5" y2="303" stroke="#26303c" stroke-width="24" stroke-linecap="round"/>
      <line x1="338" y1="258" x2="369.5" y2="303" stroke="#d97f22" stroke-width="17" stroke-linecap="round"/>
      <circle cx="369.5" cy="303" r="10" fill="#d97f22" stroke="#26303c" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="8.2 369.5 303; -23 369.5 303; 50.6 369.5 303; 75.6 369.5 303; 8.2 369.5 303" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" begin="-0.55s" repeatCount="indefinite"/>
        <line x1="369.5" y1="303" x2="391.3" y2="406" stroke="#26303c" stroke-width="20" stroke-linecap="round"/>
        <line x1="369.5" y1="303" x2="391.3" y2="406" stroke="#d97f22" stroke-width="13" stroke-linecap="round"/>
        <ellipse cx="391" cy="406" rx="16" ry="9" fill="#d97f22" stroke="#26303c" stroke-width="3" transform="rotate(-10 391 406)"/>
      </g>
    </g>
  </g>

  <!-- 自行车 -->
  <g fill="none">
    <!-- 车轮 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 280 380" to="360 280 380" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="280" cy="380" r="56" stroke="#2b2f38" stroke-width="10"/>
      <circle cx="280" cy="380" r="47" stroke="#cdd6e0" stroke-width="5"/>
      <g stroke="#aeb9c7" stroke-width="3">
        <line x1="235" y1="380" x2="325" y2="380"/>
        <line x1="280" y1="335" x2="280" y2="425"/>
        <line x1="248.2" y1="348.2" x2="311.8" y2="411.8"/>
        <line x1="248.2" y1="411.8" x2="311.8" y2="348.2"/>
      </g>
      <circle cx="280" cy="380" r="6" fill="#6b7280" stroke="#26303c" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 380" to="360 500 380" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="500" cy="380" r="56" stroke="#2b2f38" stroke-width="10"/>
      <circle cx="500" cy="380" r="47" stroke="#cdd6e0" stroke-width="5"/>
      <g stroke="#aeb9c7" stroke-width="3">
        <line x1="455" y1="380" x2="545" y2="380"/>
        <line x1="500" y1="335" x2="500" y2="425"/>
        <line x1="468.2" y1="348.2" x2="531.8" y2="411.8"/>
        <line x1="468.2" y1="411.8" x2="531.8" y2="348.2"/>
      </g>
      <circle cx="500" cy="380" r="6" fill="#6b7280" stroke="#26303c" stroke-width="2"/>
    </g>

    <!-- 链条与飞轮 -->
    <circle cx="280" cy="380" r="9" stroke="#8b93a1" stroke-width="4"/>
    <path d="M 390,372 L 280,371 M 390,404 L 280,389" stroke="#8b93a1" stroke-width="3"/>

    <!-- 车架 -->
    <g stroke="#ef5b3e" stroke-width="8" stroke-linecap="round">
      <path d="M 390,388 L 335,258"/>
      <path d="M 390,388 L 281,380"/>
      <path d="M 281,380 L 335,262"/>
      <path d="M 337,264 L 499,282"/>
      <path d="M 390,388 L 497,286"/>
      <path d="M 502,296 Q 510,336 500,380"/>
      <path d="M 499,280 L 503,256" stroke-width="7"/>
    </g>

    <!-- 车把 -->
    <path d="M 503,258 Q 524,248 545,254" stroke="#333944" stroke-width="7" stroke-linecap="round"/>
    <circle cx="545" cy="254" r="7" fill="#26303c" stroke="none"/>

    <!-- 座椅 -->
    <ellipse cx="334" cy="259" rx="27" ry="8" fill="#333944" stroke="#26303c" stroke-width="3"/>

    <!-- 牙盘 + 曲柄 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 390 388" to="360 390 388" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="390" cy="388" r="16" stroke="#cdd6e0" stroke-width="5"/>
      <circle cx="390" cy="388" r="6" fill="#3a3f4a" stroke="#26303c" stroke-width="2"/>
      <g stroke="#3a3f4a" stroke-width="7" stroke-linecap="round">
        <line x1="390" y1="388" x2="422" y2="388"/>
        <line x1="390" y1="388" x2="358" y2="388"/>
      </g>
      <rect x="414" y="383" width="16" height="10" rx="2" fill="#26303c" stroke="none"/>
      <rect x="350" y="383" width="16" height="10" rx="2" fill="#26303c" stroke="none"/>
    </g>
  </g>

  <!-- 近侧腿 -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-18.4 338 258; 17.2 338 258; -23.7 338 258; -62.2 338 258; -18.4 338 258" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      <line x1="338" y1="258" x2="369.5" y2="303" stroke="#26303c" stroke-width="24" stroke-linecap="round"/>
      <line x1="338" y1="258" x2="369.5" y2="303" stroke="#f79b2e" stroke-width="17" stroke-linecap="round"/>
      <circle cx="369.5" cy="303" r="10" fill="#f79b2e" stroke="#26303c" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="8.2 369.5 303; -23 369.5 303; 50.6 369.5 303; 75.6 369.5 303; 8.2 369.5 303" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
        <line x1="369.5" y1="303" x2="391.3" y2="406" stroke="#26303c" stroke-width="20" stroke-linecap="round"/>
        <line x1="369.5" y1="303" x2="391.3" y2="406" stroke="#f79b2e" stroke-width="13" stroke-linecap="round"/>
        <ellipse cx="391" cy="406" rx="16" ry="9" fill="#f79b2e" stroke="#26303c" stroke-width="3" transform="rotate(-10 391 406)"/>
      </g>
    </g>
  </g>

  <!-- 鹈鹕(身体轻微颠簸) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 330 215; 7 330 215; 0 330 215; -7 330 215; 0 330 215" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M 330,200 L 262,186 L 268,208 Z" fill="#f0f4f8" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 332,212 L 256,210 L 264,232 Z" fill="#f0f4f8" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 330,226 L 268,240 L 282,254 Z" fill="#f0f4f8" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="350" cy="216" rx="58" ry="44" fill="#ffffff" stroke="#26303c" stroke-width="3" transform="rotate(15 350 216)"/>
    <path d="M 316,232 q 14,8 30,6 M 310,216 q 14,8 30,6" stroke="#dbe3ec" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 脖子 -->
    <path d="M 378,190 C 392,165 396,142 408,130" stroke="#26303c" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M 378,190 C 392,165 396,142 408,130" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="417" cy="120" r="26" fill="#ffffff" stroke="#26303c" stroke-width="3"/>
    <path d="M 405,96 q -7,-15 4,-19 q -2,11 7,15" fill="#ffffff" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>

    <!-- 喙囊(轻微抖动) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" keyTimes="0;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M 436,126 L 560,130 Q 500,188 436,126 Z" fill="#f79b2e" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- 上喙 -->
    <path d="M 434,104 Q 512,106 562,128 Q 512,122 436,126 Z" fill="#ffc94d" stroke="#26303c" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="472" cy="113" r="2.5" fill="#26303c"/>

    <!-- 眼睛 -->
    <path d="M 416,98 q 10,-4 20,2" stroke="#26303c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="427" cy="111" r="6" fill="#26303c"/>
    <circle cx="429" cy="109" r="2" fill="#ffffff"/>

    <!-- 翼(扶车把) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 380 200; 1 380 200; 0 380 200; -1 380 200; 0 380 200" keyTimes="0;0.25;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M 378,200 Q 452,206 536,244" stroke="#26303c" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M 378,200 Q 452,206 536,244" stroke="#ffffff" stroke-width="24" fill="none" stroke-linecap="round"/>
      <path d="M 420,210 Q 468,222 512,244 M 452,216 Q 492,228 526,248" stroke="#dbe3ec" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="543" cy="252" r="12" fill="#ffffff" stroke="#26303c" stroke-width="3"/>
      <path d="M 548,244 q 7,4 9,11" stroke="#26303c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</div>
</body>
</html>
