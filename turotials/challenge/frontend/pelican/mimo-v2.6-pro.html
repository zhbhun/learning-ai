<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #1d2733;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(96vw, 1100px);
    aspect-ratio: 1000 / 620;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .caption { color: #8fa3b5; font-size: 14px; letter-spacing: .35em; }

  /* ---- CSS 动画只做位移 / 透明度 / 描边虚线（与旋转原点无关，绝对安全） ---- */
  @keyframes bob      { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  @keyframes drift    { from { transform: translateX(1150px); } to { transform: translateX(-360px); } }
  @keyframes scroll   { from { transform: translateX(0); } to { transform: translateX(-560px); } }
  @keyframes rush     { 0%   { transform: translateX(80px);  opacity: 0; }
                        25%  { opacity: .85; }
                        100% { transform: translateX(-160px); opacity: 0; } }
  @keyframes chainflow{ to   { stroke-dashoffset: -11; } }

  .bob    { animation: bob .45s ease-in-out infinite; }
  .cloud-a{ animation: drift 27s linear infinite; }
  .cloud-b{ animation: drift 38s linear infinite; animation-delay: -15s; }
  .cloud-c{ animation: drift 31s linear infinite; animation-delay: -26s; }
  .scenery{ animation: scroll 2.15s linear infinite; }
  .speed  { animation: rush 1.05s ease-out infinite; }
  .speed-2{ animation-delay: -.36s; }
  .speed-3{ animation-delay: -.72s; }
  .chain-dash { stroke-dasharray: 5.5 5.5; animation: chainflow .32s linear infinite; }

  /* 对侧肢体：降低饱和度，往后退 */
  .far .leg-line { stroke: #c48a52; }
  .far .leg-out  { stroke: #7a5a3a; }
  .far .foot     { fill: #c4734a; stroke: #7a5a3a; }
  .far .pedal    { fill: #565b6b; stroke: none; }
  .far .crank-arm{ stroke: #8a8f9c; }
</style>
</head>
