<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 700px at 50% 12%, #1b2a47 0%, #0d1526 55%, #090e1a 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  .scene {
    width: min(94vw, 1040px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, .75),
      0 0 0 1px rgba(255, 255, 255, .07),
      0 0 120px -40px rgba(120, 180, 255, .25);
  }
  .scene svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 1000 640" role="img" aria-label="一只鹈鹕骑着自行车沿公路飞驰的 2D 动画">
  <title>Pelican on a Bicycle</title>

  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d7f2"/>
      <stop offset=".55" stop-color="#d9ecf8"/>
      <stop offset="1" stop-color="#fdf3dd"/>
    </linearGradient>
    <radialGradient id="sunG" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".65" stop-color="#ffdf8a"/>
      <stop offset="1" stop-color="#ffc95c"/>
    </radialGradient>
    <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farHillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e6dc"/>
      <stop offset="1" stop-color="#bcd8cc"/>
    </linearGradient>
    <linearGradient id="nearHillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3dbaa"/>
      <stop offset="1" stop-color="#8fc98a"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa4b1"/>
      <stop offset=".5" stop-color="#8792a1"/>
      <stop offset="1" stop-color="#798492"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#dce5ee"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8c96a"/>
      <stop offset="1" stop-color="#eda63c"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9bb62"/>
      <stop offset=".55" stop-color="#f2a445"/>
      <stop offset="1" stop-color="#e88f26"/>
    </linearGradient>

    <g id="cloud">
      <path d="M -42 8 C -48 -6, -34 -18, -21 -13 C -17 -25, 4 -29, 13 -19 C 25 -26, 40 -17, 37 -5 C 45 -3, 47 7, 37 10 C 12 15, -30 15, -42 8 Z" fill="#ffffff" opacity=".95"/>
      <ellipse cx="-3" cy="9" rx="37" ry="4.5" fill="#dde9f3" opacity=".8"/>
    </g>

    <g id="hillsFarTile">
      <path d="M 0 560 C 30 505, 74 486, 118 502 C 152 514, 178 542, 214 550 C 260 560, 300 522, 348 508 C 396 494, 442 528, 470 546 C 480 552, 492 557, 500 560 Z" fill="url(#farHillG)"/>
    </g>
    <g id="hillsNearTile">
      <path d="M 0 560 C 40 478, 122 438, 196 464 C 252 484, 286 528, 330 546 C 372 562, 404 524, 446 516 C 470 512, 486 540, 500 560 Z" fill="url(#nearHillG)"/>
    </g>
    <g id="roadSpeckTile">
      <ellipse cx="80" cy="578" rx="8" ry="2.4" fill="#b9c1cb" opacity=".75"/>
      <ellipse cx="318" cy="586" rx="6" ry="2" fill="#b9c1cb" opacity=".6"/>
      <ellipse cx="212" cy="626" rx="10" ry="2.6" fill="#697382" opacity=".55"/>
    </g>
  </defs>

  <!-- ======================= 天空 ======================= -->
  <rect x="0" y="0" width="1000" height="560" fill="url(#skyG)"/>

  <!-- 云（两层视差，无限无缝滚动） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="40s" begin="-12s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#cloud" transform="translate(70 84) scale(.72)"/>
    <use href="#cloud" transform="translate(300 126) scale(.5)"/>
    <use href="#cloud" transform="translate(432 72) scale(.62)"/>
    <use href="#cloud" transform="translate(570 84) scale(.72)"/>
    <use href="#cloud" transform="translate(800 126) scale(.5)"/>
    <use href="#cloud" transform="translate(932 72) scale(.62)"/>
    <use href="#cloud" transform="translate(1070 84) scale(.72)"/>
    <use href="#cloud" transform="translate(1300 126) scale(.5)"/>
    <use href="#cloud" transform="translate(1432 72) scale(.62)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="26s" begin="-6s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#cloud" transform="translate(150 216) scale(1.05)"/>
    <use href="#cloud" transform="translate(420 194) scale(.78)"/>
    <use href="#cloud" transform="translate(650 216) scale(1.05)"/>
    <use href="#cloud" transform="translate(920 194) scale(.78)"/>
    <use href="#cloud" transform="translate(1150 216) scale(1.05)"/>
    <use href="#cloud" transform="translate(1420 194) scale(.78)"/>
  </g>

  <!-- 飞鸟 -->
  <g transform="translate(1150 150)">
    <animateTransform attributeName="transform" type="translate" values="1150 150; -220 150" dur="46s" begin="-22s" repeatCount="indefinite" calcMode="linear" additive="replace"/>
    <g stroke="#49596b" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; -24; 0" dur=".42s" repeatCount="indefinite"/>
        <path d="M 0 0 L -14 -7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 24; 0" dur=".42s" repeatCount="indefinite"/>
        <path d="M 0 0 L 14 -7"/>
      </g>
    </g>
  </g>
  <g transform="translate(1210 210)">
    <animateTransform attributeName="transform" type="translate" values="1210 210; -200 210" dur="58s" begin="-39s" repeatCount="indefinite" calcMode="linear"/>
    <g stroke="#5a6a7b" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".7">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; -22; 0" dur=".5s" repeatCount="indefinite"/>
        <path d="M 0 0 L -11 -6"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0; 22; 0" dur=".5s" repeatCount="indefinite"/>
        <path d="M 0 0 L 11 -6"/>
      </g>
    </g>
  </g>

  <!-- 太阳 -->
  <g transform="translate(830 118)">
    <circle r="92" fill="url(#glowG)">
      <animateTransform attributeName="transform" type="scale" values="1; 1.07; 1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="44" fill="url(#sunG)"/>
  </g>

  <!-- ======================= 远景 ======================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="14s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#hillsFarTile" x="0"/>
    <use href="#hillsFarTile" x="500"/>
    <use href="#hillsFarTile" x="1000"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#hillsNearTile" x="0"/>
    <use href="#hillsNearTile" x="500"/>
    <use href="#hillsNearTile" x="1000"/>
  </g>

  <!-- ======================= 公路 ======================= -->
  <rect x="0" y="560" width="1000" height="80" fill="url(#roadG)"/>
  <line x1="0" y1="560" x2="1000" y2="560" stroke="#eef3f7" stroke-width="3" opacity=".9"/>
  <!-- 车道虚线 -->
  <line x1="0" y1="602" x2="1000" y2="602" stroke="#f2f5f8" stroke-width="7" stroke-dasharray="46 34" opacity=".85">
    <animate attributeName="stroke-dashoffset" values="0; 160" dur="1.1s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <!-- 路面碎屑（随地面快速后移） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="3.45s" repeatCount="indefinite" calcMode="linear"/>
    <use href="#roadSpeckTile" x="0"/>
    <use href="#roadSpeckTile" x="500"/>
    <use href="#roadSpeckTile" x="1000"/>
  </g>

  <!-- 车下阴影 -->
  <ellipse cx="500" cy="562" rx="196" ry="10" fill="#2b3440" opacity=".13"/>

  <!-- ======================= 远侧腿（在车架后面） ======================= -->
  <g transform="translate(440 311)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-27.9; -30.1; -32.8; -35.9; -39.2; -42.6; -46; -49.4; -52.7; -55.7; -58.1; -60; -61; -61.1; -60.1; -58.3; -55.5; -51.9; -47.7; -42.9; -38; -33.1; -29.1; -27.2" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M -9 2 C -10 28, -9 58, -8 84 C -3 90, 3 90, 8 84 C 9 58, 10 28, 9 2 C 6 -3, -6 -3, -9 2 Z" fill="#d0812b"/>
      <g transform="translate(0 90)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="18.3; 24.5; 31.7; 38.9; 46; 52.5; 58.4; 63.5; 67.6; 70.4; 72; 72.3; 71.1; 68.7; 65; 60.3; 54.7; 48.3; 41.4; 34.2; 27; 20.3; 15.3; 14.5" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
          <path d="M -7 0 C -8 31, -7 73, -6 104 C -2 108, 2 108, 6 104 C 7 73, 8 31, 7 0 C 4 -3, -4 -3, -7 0 Z" fill="#ca7a26"/>
          <g transform="translate(0 106)">
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-80.3; -86.5; -92.8; -98.7; -103.7; -107.7; -110.4; -111.8; -111.8; -110.4; -107.9; -104.4; -100.2; -95.6; -90.9; -86.4; -82.3; -78.7; -75.8; -73.6; -72.1; -71.5; -72.2; -75.1" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
              <path d="M -10 0 C -13 -6, -5 -10, 2 -7 C 10 -4, 20 -3, 26 1 C 29 4, 26 9, 19 9 C 8 9, -2 8, -8 5 C -11 3, -10 1, -10 0 Z" fill="#d68a35"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ======================= 车轮 ======================= -->
  <g transform="translate(340 480)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur=".6s" repeatCount="indefinite" calcMode="linear"/>
      <circle r="76" fill="none" stroke="#313943" stroke-width="8"/>
      <circle r="67" fill="none" stroke="#d5dce3" stroke-width="4"/>
      <g stroke="#b6c0ca" stroke-width="1.8">
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(0)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#39424c"/>
      <circle r="3" fill="#232a32"/>
      <circle cx="0" cy="-56" r="3" fill="#e0455a"/>
    </g>
  </g>
  <g transform="translate(660 480)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur=".6s" begin="-.3s" repeatCount="indefinite" calcMode="linear"/>
      <circle r="76" fill="none" stroke="#313943" stroke-width="8"/>
      <circle r="67" fill="none" stroke="#d5dce3" stroke-width="4"/>
      <g stroke="#b6c0ca" stroke-width="1.8">
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(0)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(30)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(60)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(90)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(120)"/>
        <line x1="-63" y1="0" x2="63" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="8" fill="#39424c"/>
      <circle r="3" fill="#232a32"/>
      <circle cx="0" cy="-56" r="3" fill="#e0455a"/>
    </g>
  </g>

  <!-- ======================= 车架 ======================= -->
  <g stroke="#17998a" stroke-linecap="round" fill="none">
    <line x1="498" y1="486" x2="340" y2="480" stroke-width="7"/>
    <line x1="444" y1="364" x2="340" y2="480" stroke-width="5.5"/>
    <line x1="498" y1="486" x2="438" y2="360" stroke-width="7"/>
    <line x1="440" y1="362" x2="628" y2="350" stroke-width="6.5"/>
    <line x1="498" y1="486" x2="636" y2="368" stroke-width="7"/>
    <line x1="626" y1="344" x2="640" y2="378" stroke-width="9"/>
    <path d="M 640 378 C 644 420, 650 450, 660 480" stroke-width="6"/>
    <line x1="632" y1="350" x2="637" y2="330" stroke-width="6"/>
  </g>
  <path d="M 637 330 C 649 325, 659 331, 661 341 C 662 348, 665 353, 669 358" stroke="#17998a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <line x1="664" y1="350" x2="671" y2="360" stroke="#333e48" stroke-width="8.5" stroke-linecap="round"/>

  <!-- 坐垫 -->
  <path d="M 396 341 C 420 338, 450 344, 466 355 C 452 362, 420 364, 402 358 C 395 355, 393 347, 396 341 Z" fill="#37424c"/>
  <path d="M 400 344 C 424 341, 448 346, 460 353" stroke="#55626e" stroke-width="1.5" fill="none"/>

  <!-- 齿盘 / 飞轮 / 链条 -->
  <circle cx="498" cy="486" r="25" fill="none" stroke="#39424c" stroke-width="5" stroke-dasharray="2.6 2.4"/>
  <circle cx="498" cy="486" r="23" fill="#39424c"/>
  <circle cx="498" cy="486" r="15" fill="none" stroke="#4a5560" stroke-width="2"/>
  <circle cx="498" cy="486" r="3.5" fill="#232a32"/>
  <circle cx="340" cy="480" r="12.5" fill="none" stroke="#39424c" stroke-width="4" stroke-dasharray="2.2 2"/>
  <circle cx="340" cy="480" r="9.5" fill="#39424c"/>
  <line x1="340" y1="468" x2="498" y2="462" stroke="#5c6672" stroke-width="3.2" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" values="0; 9" dur=".15s" repeatCount="indefinite" calcMode="linear"/>
  </line>
  <line x1="340" y1="492" x2="498" y2="510" stroke="#5c6672" stroke-width="3.2" stroke-dasharray="5 4">
    <animate attributeName="stroke-dashoffset" values="0; -9" dur=".15s" repeatCount="indefinite" calcMode="linear"/>
  </line>

  <!-- ======================= 曲柄（踏板保持水平） ======================= -->
  <g transform="translate(498 486)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#2f3841" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#2f3841" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(0 -18)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; -360 0 0" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
          <rect x="-13" y="-2.5" width="26" height="5" rx="2" fill="#39424c"/>
        </g>
        <circle r="3.5" fill="#232a32"/>
      </g>
      <g transform="translate(0 18)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; -360 0 0" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
          <rect x="-13" y="-2.5" width="26" height="5" rx="2" fill="#39424c"/>
        </g>
        <circle r="3.5" fill="#232a32"/>
      </g>
    </g>
  </g>

  <!-- ======================= 近侧腿（踩踏板，在躯干图层之下） ======================= -->
  <g transform="translate(450 318)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-61; -61.4; -60.8; -59.2; -56.7; -53.5; -49.6; -45.4; -41.1; -37.1; -33.9; -31.9; -31.4; -32.3; -34; -36.4; -39.2; -42.2; -45.5; -48.8; -52; -55; -57.7; -59.7" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M -9 2 C -10 28, -9 58, -8 84 C -3 90, 3 90, 8 84 C 9 58, 10 28, 9 2 C 6 -3, -6 -3, -9 2 Z" fill="#f09a3e"/>
      <g transform="translate(0 88)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="76.4; 74.2; 70.8; 66.4; 61.2; 55.3; 49.1; 42.8; 36.8; 31.7; 28.2; 27.3; 29.1; 33.2; 38.7; 44.8; 51.2; 57.3; 63; 68; 72; 75; 76.8; 77.2" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
          <path d="M -7 0 C -8 30, -7 70, -6 100 C -2 104, 2 104, 6 100 C 7 70, 8 30, 7 0 C 4 -3, -4 -3, -7 0 Z" fill="#ee9436"/>
          <g transform="translate(0 102)">
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-105.3; -100.7; -96; -91.6; -87.6; -84.1; -81.5; -79.6; -78.7; -78.9; -80.4; -83.3; -87.7; -93; -98.6; -104.1; -108.9; -112.8; -115.5; -116.9; -117; -115.6; -113.1; -109.6" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>
              <path d="M -10 0 C -13 -6, -5 -10, 2 -7 C 10 -4, 20 -3, 26 1 C 29 4, 26 9, 19 9 C 8 9, -2 8, -8 5 C -11 3, -10 1, -10 0 Z" fill="#f2a446"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ======================= 风的速度线（在骑手身后） ======================= -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 0; -80 0" dur=".9s" repeatCount="indefinite" calcMode="linear"/>
      <line x1="250" y1="186" x2="320" y2="182" opacity="0">
        <animate attributeName="opacity" values=".4; .65; 0" keyTimes="0; .25; 1" dur=".9s" repeatCount="indefinite"/>
      </line>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 0; -80 0" dur=".9s" begin="-.3s" repeatCount="indefinite" calcMode="linear"/>
      <line x1="240" y1="208" x2="310" y2="205" opacity="0">
        <animate attributeName="opacity" values=".4; .65; 0" keyTimes="0; .25; 1" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
      </line>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 0; -80 0" dur=".9s" begin="-.6s" repeatCount="indefinite" calcMode="linear"/>
      <line x1="255" y1="232" x2="330" y2="230" opacity="0">
        <animate attributeName="opacity" values=".4; .65; 0" keyTimes="0; .25; 1" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ======================= 鹈鹕 ======================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur=".6s" repeatCount="indefinite" calcMode="linear"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-0.6 450 318; 0.6 450 318; -0.6 450 318" dur="1.2s" repeatCount="indefinite" calcMode="linear"/>

      <!-- 尾羽 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 352 266; 3 352 266; -3 352 266" dur="1s" repeatCount="indefinite" calcMode="linear"/>
        <path d="M 354 258 C 336 242, 308 234, 280 236 C 298 248, 320 260, 344 270 Z" fill="#e8eef4"/>
        <path d="M 352 268 C 328 262, 298 262, 272 270 C 294 278, 322 284, 342 284 Z" fill="#dbe4ec"/>
        <path d="M 350 278 C 328 284, 302 294, 284 306 C 306 310, 330 302, 346 290 Z" fill="#e8eef4"/>
        <path d="M 352 288 C 336 302, 320 318, 310 332 C 326 326, 344 312, 354 298 Z" fill="#dbe4ec"/>
      </g>

      <!-- 身体 -->
      <path d="M 348 262 C 372 208, 428 194, 478 214 C 512 228, 528 252, 522 286 C 516 320, 480 348, 440 350 C 408 351, 380 336, 366 310 C 352 288, 348 274, 348 262 Z" fill="url(#bodyG)" stroke="#e3eaf1" stroke-width="1.5"/>
      <path d="M 366 310 C 380 336, 408 351, 440 350 C 480 348, 516 320, 522 286 C 506 312, 478 332, 444 333 C 414 334, 386 324, 366 310 Z" fill="#e4ebf2" opacity=".9"/>
      <path d="M 384 226 C 420 236, 448 262, 462 300 C 440 320, 410 330, 386 326 C 398 296, 398 258, 384 226 Z" fill="#eaeff5" opacity=".95"/>

      <!-- 脖子 -->
      <path d="M 478 214 C 506 186, 540 164, 572 154 C 574 162, 576 172, 578 180 C 556 190, 528 208, 506 234 C 496 228, 486 222, 478 214 Z" fill="url(#bodyG)"/>

      <!-- 围巾（围在脖子上，向后飘扬） -->
