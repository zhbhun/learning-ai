<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑单车的鹈鹕 · SVG 动画</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 18%, #26323f 0%, #0d1319 72%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
  }
  .stage {
    width: min(94vw, 156vh, 1180px);
    aspect-ratio: 900 / 540;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 34px 80px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.09) inset;
  }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 900 540" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="一只鹈鹕骑着自行车向右匀速前进的循环动画">

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3f9bd8"/>
      <stop offset=".42" stop-color="#8ecdf0"/>
      <stop offset=".80" stop-color="#d3ecfa"/>
      <stop offset="1"   stop-color="#ecf7fd"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#fff8cf" stop-opacity=".9"/>
      <stop offset=".38" stop-color="#ffeaa4" stop-opacity=".3"/>
      <stop offset="1"   stop-color="#ffeaa4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c9791"/>
      <stop offset="1" stop-color="#6e6b68"/>
    </linearGradient>
    <linearGradient id="vergeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea75f"/>
      <stop offset="1" stop-color="#2f5438"/>
    </linearGradient>
    <radialGradient id="shadowGrad">
      <stop offset="0" stop-color="#1b2a1d" stop-opacity=".34"/>
      <stop offset=".65" stop-color="#1b2a1d" stop-opacity=".15"/>
      <stop offset="1" stop-color="#1b2a1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1=".15" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#dbe6f0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#d3dfeb"/>
    </linearGradient>
    <linearGradient id="billGrad" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffcb54"/>
      <stop offset="1" stop-color="#eb8a16"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1=".15" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#ffc06e"/>
      <stop offset=".5" stop-color="#f79c46"/>
      <stop offset="1" stop-color="#e2761f"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f46452"/>
      <stop offset="1" stop-color="#cd3628"/>
    </linearGradient>

    <!-- ============ 远景：云 ============ -->
    <g id="cloudTile">
      <g>
        <ellipse cx="112" cy="138" rx="52" ry="10" fill="#cfe2f2" opacity=".75"/>
        <ellipse cx="110" cy="112" rx="50" ry="27" fill="#fff"/>
        <ellipse cx="72"  cy="122" rx="36" ry="20" fill="#fff"/>
        <ellipse cx="150" cy="122" rx="40" ry="19" fill="#fff"/>
        <ellipse cx="112" cy="130" rx="58" ry="17" fill="#fff"/>
      </g>
      <g transform="translate(430 40) scale(.72)">
        <ellipse cx="112" cy="138" rx="52" ry="10" fill="#cfe2f2" opacity=".7"/>
        <ellipse cx="110" cy="112" rx="50" ry="27" fill="#fff"/>
        <ellipse cx="72"  cy="122" rx="36" ry="20" fill="#fff"/>
        <ellipse cx="150" cy="122" rx="40" ry="19" fill="#fff"/>
        <ellipse cx="112" cy="130" rx="58" ry="17" fill="#fff"/>
      </g>
      <g transform="translate(806 126) scale(.9)">
        <ellipse cx="112" cy="138" rx="52" ry="10" fill="#cfe2f2" opacity=".7"/>
        <ellipse cx="110" cy="112" rx="50" ry="27" fill="#fff"/>
        <ellipse cx="72"  cy="122" rx="36" ry="20" fill="#fff"/>
        <ellipse cx="150" cy="122" rx="40" ry="19" fill="#fff"/>
        <ellipse cx="112" cy="130" rx="58" ry="17" fill="#fff"/>
      </g>
      <g transform="translate(646 192) scale(.5)" opacity=".7">
        <ellipse cx="112" cy="138" rx="52" ry="10" fill="#cfe2f2"/>
        <ellipse cx="110" cy="112" rx="50" ry="27" fill="#fff"/>
        <ellipse cx="72"  cy="122" rx="36" ry="20" fill="#fff"/>
        <ellipse cx="150" cy="122" rx="40" ry="19" fill="#fff"/>
        <ellipse cx="112" cy="130" rx="58" ry="17" fill="#fff"/>
      </g>
      <g transform="translate(1076 74) scale(.6)" opacity=".65">
        <ellipse cx="112" cy="138" rx="52" ry="10" fill="#cfe2f2"/>
        <ellipse cx="110" cy="112" rx="50" ry="27" fill="#fff"/>
        <ellipse cx="72"  cy="122" rx="36" ry="20" fill="#fff"/>
        <ellipse cx="150" cy="122" rx="40" ry="19" fill="#fff"/>
        <ellipse cx="112" cy="130" rx="58" ry="17" fill="#fff"/>
      </g>
    </g>

    <!-- ============ 远山（周期 1200，接缝无痕） ============ -->
    <g id="hillsFarTile">
      <path fill="#b3d0dd" d="M0 396 C 66 348 133 348 200 396 C 266 444 333 444 400 396
        C 466 348 533 348 600 396 C 666 444 733 444 800 396 C 866 348 933 348 1000 396
        C 1066 444 1133 444 1200 396 L1200 470 L0 470 Z"/>
      <path fill="#a3c6d6" opacity=".6" d="M0 420 C 80 392 140 392 210 420 C 280 448 340 448 410 420
        C 480 392 540 392 610 420 C 680 448 740 448 810 420 C 880 392 940 392 1010 420
        C 1080 448 1140 448 1200 420 L1200 470 L0 470 Z"/>
    </g>

    <!-- ============ 中山 ============ -->
    <g id="hillsMidTile">
      <path fill="#82bd94" d="M0 424 C 100 384 200 384 300 424 C 400 464 500 464 600 424
        C 700 384 800 384 900 424 C 1000 464 1100 464 1200 424 L1200 470 L0 470 Z"/>
      <path fill="#71b085" opacity=".75" d="M0 444 C 120 420 240 420 360 444 C 480 468 600 468 720 444
        C 840 420 960 420 1080 444 C 1140 456 1170 460 1200 462 L1200 470 L0 470 Z"/>
    </g>

    <!-- ============ 近景灌木 / 树 ============ -->
    <g id="hedgeTile">
      <g fill="#63ab77">
        <ellipse cx="60"  cy="456" rx="64" ry="26"/>
        <ellipse cx="132" cy="464" rx="42" ry="18"/>
        <ellipse cx="288" cy="454" rx="56" ry="24"/>
        <ellipse cx="452" cy="462" rx="46" ry="20"/>
        <ellipse cx="704" cy="452" rx="60" ry="26"/>
        <ellipse cx="842" cy="462" rx="44" ry="19"/>
        <ellipse cx="1010" cy="456" rx="58" ry="24"/>
        <ellipse cx="1130" cy="464" rx="40" ry="17"/>
      </g>
      <g fill="#559a6b" opacity=".85">
        <ellipse cx="96"  cy="466" rx="52" ry="16"/>
        <ellipse cx="368" cy="466" rx="54" ry="15"/>
        <ellipse cx="772" cy="466" rx="56" ry="16"/>
        <ellipse cx="1070" cy="466" rx="50" ry="15"/>
      </g>
      <g>
        <rect x="576" y="398" width="8" height="66" rx="3" fill="#6d5439"/>
        <circle cx="580" cy="392" r="31" fill="#4f9a63"/>
        <circle cx="556" cy="406" r="22" fill="#5aa870"/>
        <circle cx="604" cy="408" r="21" fill="#5aa870"/>
        <rect x="944" y="412" width="7" height="52" rx="3" fill="#6d5439"/>
        <circle cx="948" cy="408" r="24" fill="#4f9a63"/>
        <circle cx="928" cy="420" r="17" fill="#5aa870"/>
        <circle cx="968" cy="420" r="16" fill="#5aa870"/>
      </g>
    </g>

    <!-- ============ 路面虚线与碎石 ============ -->
    <g id="roadTile">
      <g fill="#f2eee6" opacity=".9">
        <rect x="0"    y="494" width="66" height="7" rx="3.5"/>
        <rect x="150"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="300"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="450"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="600"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="750"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="900"  y="494" width="66" height="7" rx="3.5"/>
        <rect x="1050" y="494" width="66" height="7" rx="3.5"/>
      </g>
      <g fill="#c9c4bb" opacity=".55">
        <circle cx="220"  cy="482" r="2.4"/>
        <circle cx="520"  cy="486" r="1.8"/>
        <circle cx="860"  cy="480" r="2.1"/>
        <circle cx="1160" cy="485" r="1.9"/>
      </g>
    </g>

    <!-- ============ 最前景草坡 ============ -->
    <g id="vergeTile">
      <g stroke="#3d6b48" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M34 540 C 38 530 30 522 22 516"/>
        <path d="M40 540 C 46 530 46 522 44 516"/>
        <path d="M150 540 C 152 528 146 520 138 515"/>
        <path d="M158 540 C 164 530 166 522 164 516"/>
        <path d="M300 540 C 302 530 296 522 288 517"/>
        <path d="M308 540 C 314 528 316 520 314 514"/>
        <path d="M470 540 C 470 528 464 520 456 515"/>
        <path d="M478 540 C 484 530 486 522 484 516"/>
        <path d="M640 540 C 642 528 636 520 628 514"/>
        <path d="M648 540 C 654 530 656 522 654 516"/>
        <path d="M800 540 C 802 530 796 522 788 517"/>
        <path d="M808 540 C 814 528 816 520 814 514"/>
        <path d="M960 540 C 960 528 954 520 946 515"/>
        <path d="M968 540 C 974 530 976 522 974 516"/>
        <path d="M1110 540 C 1112 528 1106 520 1098 514"/>
        <path d="M1118 540 C 1124 530 1126 522 1124 516"/>
      </g>
      <g fill="#8b8378" opacity=".9">
        <ellipse cx="212"  cy="532" rx="9" ry="5"/>
        <ellipse cx="392"  cy="538" rx="6" ry="3.5"/>
        <ellipse cx="700"  cy="534" rx="8" ry="4.5"/>
        <ellipse cx="1042" cy="537" rx="7" ry="4"/>
      </g>
    </g>

    <!-- ============ 车轮 ============ -->
    <g id="wheel">
      <circle r="70" fill="none" stroke="#2b3038" stroke-width="11"/>
      <circle r="64" fill="none" stroke="#3d444e" stroke-width="3"/>
      <circle r="58" fill="none" stroke="#dfe6ef" stroke-width="5"/>
      <circle r="54" fill="none" stroke="#aab5c3" stroke-width="1.6"/>
      <g stroke="#c2ccda" stroke-width="1.6" opacity=".95">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(22.5)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(45)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(67.5)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(90)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(112.5)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(135)"/>
        <line x1="0" y1="-55" x2="0" y2="55" transform="rotate(157.5)"/>
      </g>
      <circle r="9" fill="#5b6675"/>
      <circle r="4" fill="#cdd6e2"/>
      <circle cx="0" cy="-58" r="3.4" fill="#f0863a"/>
    </g>

    <!-- ============ 车架（同一组路径描两次做高光） ============ -->
    <g id="framePaths" fill="none" stroke-linecap="round">
      <path d="M398 414 L300 400"/>
      <path d="M398 414 L352 292"/>
      <path d="M352 292 L300 400"/>
      <path d="M352 292 L536 294"/>
      <path d="M398 414 L516 354"/>
      <path d="M536 294 L516 354"/>
      <path d="M516 354 L580 400"/>
      <path d="M540 276 L536 294"/>
      <path d="M352 292 L347 279"/>
    </g>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect x="0" y="0" width="900" height="540" fill="url(#skyGrad)"/>
  <circle cx="752" cy="102" r="140" fill="url(#sunGlow)"/>
  <circle id="sun" cx="752" cy="102" r="40" fill="#fff9dc"/>

  <g id="clouds">
    <use href="#cloudTile"/>
    <use href="#cloudTile" x="1200"/>
  </g>
  <g id="far">
    <use href="#hillsFarTile"/>
    <use href="#hillsFarTile" x="1200"/>
  </g>
  <g id="mid">
    <use href="#hillsMidTile"/>
    <use href="#hillsMidTile" x="1200"/>
  </g>
  <g id="hedge">
    <use href="#hedgeTile"/>
    <use href="#hedgeTile" x="1200"/>
  </g>

  <rect x="0" y="470" width="900" height="44" fill="url(#roadGrad)"/>
  <rect x="0" y="470" width="900" height="3" fill="#b4aea6" opacity=".8"/>
  <g id="roadMarks">
    <use href="#roadTile"/>
    <use href="#roadTile" x="1200"/>
  </g>
  <rect x="0" y="514" width="900" height="26" fill="url(#vergeGrad)"/>
  <g id="verge">
    <use href="#vergeTile"/>
    <use href="#vergeTile" x="1200"/>
  </g>

  <!-- ================= 鹈鹕 + 单车 ================= -->
  <g id="rig">
    <ellipse id="shadow" cx="442" cy="476" rx="216" ry="11" fill="url(#shadowGrad)"/>

    <!-- 远侧腿：先画，被车身遮挡 -->
    <g id="legFar">
      <path id="thighFarOut" fill="none" stroke="#a3601a" stroke-width="23" stroke-linecap="round"/>
      <path id="shinFarOut"  fill="none" stroke="#a3601a" stroke-width="16" stroke-linecap="round"/>
      <path id="thighFar" fill="none" stroke="#c67f2a" stroke-width="19" stroke-linecap="round"/>
      <path id="shinFar"  fill="none" stroke="#c67f2a" stroke-width="12" stroke-linecap="round"/>
      <g id="footFar">
        <path d="M-8 -5 L22 -4 Q30 0 22 5 L-7 7 Q-11 1 -8 -5 Z"
              fill="#c67f2a" stroke="#a3601a" stroke-width="1.8"/>
      </g>
    </g>
    <g id="crankFar"><rect x="394" y="414" width="8" height="34" rx="4" fill="#39404a"/></g>
    <g id="pedalFar"><rect x="-13" y="-4" width="26" height="8" rx="3" fill="#39404a"/></g>

    <!-- 车轮 -->
    <g transform="translate(300 400)"><g id="wheelRear"><use href="#wheel"/></g></g>
    <g transform="translate(580 400)"><g id="wheelFront"><use href="#wheel"/></g></g>

    <!-- 后飞轮 -->
    <g transform="translate(300 400)"><g id="cogSpin">
      <circle r="13" fill="none" stroke="#c8d3e0" stroke-width="3"/>
      <circle r="13.5" fill="none" stroke="#a9b6c6" stroke-width="3" stroke-dasharray="2.6 2.6"/>
      <circle r="4" fill="#8b98a8"/>
    </g></g>

    <!-- 牙盘 -->
    <g transform="translate(398 414)"><g id="ringSpin">
      <circle r="27" fill="none" stroke="#a9b6c6" stroke-width="4" stroke-dasharray="3 3"/>
      <circle r="26" fill="none" stroke="#d5dde8" stroke-width="3"/>
      <circle r="18" fill="none" stroke="#9aa8b8" stroke-width="2"/>
      <g stroke="#9aa8b8" stroke-width="3">
        <line x1="0" y1="0" x2="0" y2="-18"/>
        <line x1="0" y1="0" x2="15.6" y2="9"/>
        <line x1="0" y1="0" x2="-15.6" y2="9"/>
      </g>
      <g fill="#7d8a9a">
        <circle cx="0" cy="-13" r="2.8"/>
        <circle cx="11.3" cy="6.5" r="2.8"/>
        <circle cx="-11.3" cy="6.5" r="2.8"/>
      </g>
    </g></g>

    <!-- 链条 -->
    <path id="chain" d="M398 388 L300 387 A13 13 0 0 0 300 413 L398 440 A26 26 0 0 0 398 388 Z"
          fill="none" stroke="#454c59" stroke-width="4.4" stroke-dasharray="9 6" stroke-linecap="round"/>

    <!-- 车架 -->
    <use href="#framePaths" stroke="#155f74" stroke-width="10"/>
    <use href="#framePaths" stroke="#2b93ad" stroke-width="4" transform="translate(-1.2 -1.4)"/>

    <!-- 近侧曲柄 + 脚踏 -->
    <g id="crankNear"><rect x="394" y="414" width="8" height="34" rx="4" fill="#454c59"/></g>
    <g id="pedalNear">
      <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#454c59"/>
      <rect x="-13" y="-4" width="26" height="3" rx="1.5" fill="#6d7684"/>
    </g>

    <!-- 车座 -->
    <g>
      <path d="M312 274 Q328 258 352 260 Q378 262 384 272 Q380 286 356 286 Q328 288 312 274 Z" fill="#7a4b2a"/>
      <path d="M318 272 Q332 262 352 264 Q372 266 378 272" fill="none" stroke="#9d6740" stroke-width="3"/>
    </g>

    <!-- 车把 -->
    <g fill="none" stroke-linecap="round">
      <path d="M540 278 Q548 264 536 259 Q521 256 511 266" stroke="#155f74" stroke-width="8"/>
      <path d="M540 278 Q548 264 536 259 Q521 256 511 266" stroke="#2b93ad" stroke-width="3" transform="translate(-1 -1.2)"/>
      <path d="M516 261 L507 269" stroke="#39404a" stroke-width="11"/>
    </g>

    <!-- 前筐（挂在车把与前叉之间）+ 鱼 -->
    <g>
      <path d="M572 260 L542 270" stroke="#7c8794" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M570 300 L552 372" stroke="#7c8794" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M580 258 L580 226" stroke="#a97f47" stroke-width="3"/>
      <path d="M616 258 L616 226" stroke="#a97f47" stroke-width="3"/>
      <path d="M568 262 Q582 232 568 216" stroke="#c0c8d2" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M582 234 L564 216 L572 244 Z" fill="#9fb4c9"/>
      <path d="M582 234 L602 220 L594 248 Z" fill="#8ba0b6"/>
      <ellipse cx="582" cy="236" rx="7.5" ry="6.5" fill="#b9c6d4"/>
      <path d="M566 258 L630 258 L622 302 L574 302 Z" fill="#c89a5e"/>
      <g stroke="#a97f47" stroke-width="2">
        <path d="M568 270 L627 270"/><path d="M570 284 L625 284"/><path d="M573 296 L623 296"/>
        <path d="M582 259 L578 301"/><path d="M598 258 L598 302"/><path d="M614 259 L618 301"/>
      </g>
      <path d="M562 254 L634 254 L631 264 L565 264 Z" fill="#d8ab6d"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g id="peli">
      <!-- 远侧翅膀 -->
      <path d="M312 176 C 336 146 372 136 398 150 C 374 156 342 168 324 186 Z" fill="#d7e2ec"/>

      <!-- 尾羽 -->
      <path d="M292 196 C 270 178 246 164 224 160 C 236 176 242 190 244 204
               C 258 196 278 194 292 200 Z" fill="#eef3f8" stroke="#cbd6e2" stroke-width="1.5"/>
      <path d="M250 172 L254 194 M268 176 L270 196" stroke="#cbd6e2" stroke-width="1.5"/>

      <!-- 身体 -->
      <ellipse cx="334" cy="222" rx="62" ry="52" transform="rotate(-20 334 222)" fill="url(#bodyGrad)"/>
      <path d="M288 244 C 310 274 356 282 384 258 C 360 276 314 272 288 244 Z" fill="#c9d6e5" opacity=".5"/>

      <!-- 脖子（厚实、向前上倾斜） -->
      <path d="M390 216 C 430 203 474 175 494 138 L478 114 C 452 142 412 163 366 182 Z"
            fill="url(#bodyGrad)"/>
      <path d="M384 208 C 420 190 458 166 484 140" fill="none" stroke="#d3dde8" stroke-width="1.6" opacity=".65"/>

      <!-- 头 + 喙 + 喉囊 -->
      <g id="head">
        <ellipse cx="486" cy="126" rx="30" ry="26" transform="rotate(-22 486 126)" fill="url(#bodyGrad)"/>

        <!-- 喉囊（鹈鹕标志）：贴着喙下垂，靠头部最深 -->
        <path id="pouch" d="M504 134 C 516 172 544 190 586 184 C 636 176 674 163 702 150
                 L 502 128 Z" fill="url(#pouchGrad)"/>
        <path d="M504 135 C 516 172 544 190 586 184 C 636 176 674 163 702 150"
              fill="none" stroke="#d2741c" stroke-width="2.6" opacity=".9"/>
        <path d="M512 146 C 522 172 542 184 568 184" fill="none" stroke="#ffd2a0"
              stroke-width="4" opacity=".45" stroke-linecap="round"/>

        <!-- 上喙（末端带下钩） -->
        <path d="M500 112 C 560 116 646 130 704 146 C 711 150 708 159 699 155
                 C 640 142 566 133 506 136 Z" fill="url(#billGrad)" stroke="#c9761a" stroke-width="2"
              stroke-linejoin="round"/>
        <path d="M508 118 C 566 122 640 134 696 148" fill="none" stroke="#ffe1a0" stroke-width="2.2" opacity=".7"/>
        <path d="M512 121 L528 122" stroke="#b96a12" stroke-width="2.6" stroke-linecap="round"/>

        <!-- 眼 -->
        <circle cx="502" cy="114" r="7.5" fill="#fff"/>
        <circle cx="503.5" cy="114.5" r="4" fill="#2b3038"/>
        <circle cx="501.6" cy="112.4" r="1.4" fill="#fff"/>
        <path d="M492 103 Q502 97 512 104" fill="none" stroke="#39404a" stroke-width="3.4" stroke-linecap="round"/>

        <!-- 头顶小羽冠 -->
        <path d="M474 108 C 466 99 465 93 468 89" fill="none" stroke="#dbe6f0" stroke-width="6" stroke-linecap="round"/>
        <path d="M484 104 C 478 95 478 88 482 84" fill="none" stroke="#e9f0f7" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- 近侧翅膀（搭在车把上） -->
      <path d="M370 172 C 420 164 462 188 490 214 C 502 228 512 248 520 261
               C 526 267 521 274 512 271 C 492 259 466 247 440 241
               C 404 235 368 225 362 207 Z"
            fill="url(#wingGrad)" stroke="#b9c8d8" stroke-width="2"/>
      <g fill="none" stroke="#c2cedb" stroke-width="1.9" stroke-linecap="round">
        <path d="M388 190 C 420 202 450 224 470 248"/>
        <path d="M378 202 C 408 212 436 232 456 254"/>
        <path d="M406 184 C 434 200 462 226 482 250"/>
        <path d="M424 178 C 450 194 476 220 496 246"/>
      </g>
      <ellipse cx="514" cy="264" rx="11" ry="9" fill="#fbfdff" stroke="#b9c8d8" stroke-width="2"/>
      <g fill="none" stroke="#b9c8d8" stroke-width="1.4" stroke-linecap="round">
        <path d="M510 259 L518 267"/><path d="M517 257 L522 265"/>
      </g>

      <!-- 围巾：领口缠在脖子上，飘带向后飞（画在翅膀之上才看得见） -->
      <g>
        <path id="scarfTail" d="M390 176 C 346 164 306 146 258 138 C 300 164 340 182 378 192 Z"
              fill="url(#scarfGrad)"/>
        <path d="M378 194 C 346 186 322 182 298 182 C 324 196 346 200 372 202 Z"
              fill="#cd3628" opacity=".92"/>
        <path d="M411 211 L385 173 L396 166 L422 204 Z" fill="url(#scarfGrad)"/>
        <path d="M356 176 C 334 168 316 160 296 152" fill="none" stroke="#b32d20"
              stroke-width="1.6" opacity=".5"/>
      </g>
    </g>

    <!-- 近侧腿：最后画，压在车架之上 -->
    <g id="legNear">
      <path id="thighNearOut" fill="none" stroke="#ffffff" stroke-width="23" stroke-linecap="round"/>
      <path id="shinNearOut"  fill="none" stroke="#ffffff" stroke-width="16.5" stroke-linecap="round"/>
      <path id="thighNear" fill="none" stroke="#e9973c" stroke-width="20" stroke-linecap="round"/>
      <path id="shinNear"  fill="none" stroke="#e9973c" stroke-width="13" stroke-linecap="round"/>
      <g id="footNear">
        <path d="M-8 -5 L22 -4 Q30 0 22 5 L-7 7 Q-11 1 -8 -5 Z"
              fill="#ef9f42" stroke="#fff" stroke-width="2.4"/>
        <path d="M2 -3 L2 6 M10 -4 L10 6 M18 -3 L18 5" stroke="#c9792c" stroke-width="1.3"/>
      </g>
    </g>
  </g>
</svg>
</div>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const S = {
    wheelRear: $("wheelRear"), wheelFront: $("wheelFront"), cogSpin: $("cogSpin"),
    crankNear: $("crankNear"), crankFar: $("crankFar"), ringSpin: $("ringSpin"),
    chain: $("chain"), sun: $("sun"), shadow: $("shadow"), peli: $("peli"), head: $("head"),
    pouch: $("pouch"), scarfTail: $("scarfTail"),
    legNear: { thighOut: $("thighNearOut"), shinOut: $("shinNearOut"),
               thigh: $("thighNear"), shin: $("shinNear"), foot: $("footNear") },
    legFar:  { thighOut: $("thighFarOut"),  shinOut: $("shinFarOut"),
               thigh: $("thighFar"),  shin: $("shinFar"),  foot: $("footFar") },
    pedalNear: $("pedalNear"), pedalFar: $("pedalFar"),
    clouds: $("clouds"), far: $("far"), mid: $("mid"), hedge: $("hedge"),
    roadMarks: $("roadMarks"), verge: $("verge")
  };

  /* ---------- 场景常量 ---------- */
  const TILE       = 1200;    // 所有视差图层的循环周期
  const SPEED      = 205;     // 前进速度 px/s
  const WHEEL_R    = 70;      // 车轮半径
  const CADENCE    = 0.75;    // 踏频 rev/s
  const RING_R     = 26;      // 牙盘半径
  const CHAIN_STEP = 15;      // 链条虚线周期

  const BB    = { x: 398, y: 414 };    // 五通（曲柄轴心）
  const CRANK = 34;                    // 曲柄长度
  const HIP   = { x: 340, y: 266 };    // 髋关节
  const L1 = 104, L2 = 99;             // 大腿 / 小腿
  const ANKLE = { x: -9, y: -7 };      // 脚踝相对脚踏中心的偏移

  /* ---------- 两骨骼 IK：由髋和目标点解出膝盖位置 ---------- */
  function ik(hx, hy, tx, ty, l1, l2) {
    const dx = tx - hx, dy = ty - hy;
    const dist = Math.max(Math.hypot(dx, dy), 1e-4);
    const ux = dx / dist, uy = dy / dist;
    const d = Math.min(Math.max(dist, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const nx = uy, ny = -ux;                 // 取“前上”侧，膝盖向前顶
    return {
      knee:  [hx + a * ux + h * nx, hy + a * uy + h * ny],
      ankle: [hx + d * ux, hy + d * uy]
    };
  }

  /* 一条腿：大腿略带前凸弧线，小腿微弯；描边与填充共用同一条 d */
  function drawLeg(hip, pedal, leg, tilt) {
    const { knee, ankle } = ik(hip.x, hip.y, pedal.x + ANKLE.x, pedal.y + ANKLE.y, L1, L2);

    // 大腿起点沿髋—膝方向向体内延长，避免圆头端帽露在肚子上
    const ex = hip.x + (hip.x - knee[0]) * 0.14, ey = hip.y + (hip.y - knee[1]) * 0.14;
    const qx = (ex + knee[0]) / 2 - 7,  qy = (ey + knee[1]) / 2 - 5;
    const sx = (knee[0] + ankle[0]) / 2 + 4, sy = (knee[1] + ankle[1]) / 2 - 2;

    const thigh = "M" + ex.toFixed(2) + " " + ey.toFixed(2) +
      " Q" + qx.toFixed(2) + " " + qy.toFixed(2) + " " + knee[0].toFixed(2) + " " + knee[1].toFixed(2);
    const shin = "M" + knee[0].toFixed(2) + " " + knee[1].toFixed(2) +
      " Q" + sx.toFixed(2) + " " + sy.toFixed(2) + " " + ankle[0].toFixed(2) + " " + ankle[1].toFixed(2);

    leg.thigh.setAttribute("d", thigh);
    leg.thighOut.setAttribute("d", thigh);
    leg.shin.setAttribute("d", shin);
    leg.shinOut.setAttribute("d", shin);
    leg.foot.setAttribute("transform",
      "translate(" + ankle[0].toFixed(2) + " " + ankle[1].toFixed(2) + ") rotate(" + tilt.toFixed(2) + ")");
  }

  /* ---------- 每帧渲染 ---------- */
  function render(t) {
    const crankA = 2 * Math.PI * CADENCE * t;       // 曲柄相位（弧度）
    const wheelA = SPEED / WHEEL_R * t;             // 车轮相位
    const deg = (rad) => (rad * 57.29578).toFixed(2);
    const crankDeg = deg(crankA);

    // 车轮 / 飞轮 / 牙盘 / 曲柄
    S.wheelRear.setAttribute("transform",  "rotate(" + deg(wheelA) + ")");
    S.wheelFront.setAttribute("transform", "rotate(" + deg(wheelA) + ")");
    S.cogSpin.setAttribute("transform",    "rotate(" + deg(wheelA) + ")");
    S.ringSpin.setAttribute("transform",   "rotate(" + crankDeg + " " + BB.x + " " + BB.y + ")");
    S.crankNear.setAttribute("transform",  "rotate(" + crankDeg + " " + BB.x + " " + BB.y + ")");
    S.crankFar.setAttribute("transform",   "rotate(" + (+crankDeg + 180) + " " + BB.x + " " + BB.y + ")");

    // 链条：线速度 = 踏频 × 牙盘周长
    const chainV = 2 * Math.PI * CADENCE * RING_R;
    S.chain.setAttribute("stroke-dashoffset", (-(chainV * t % CHAIN_STEP)).toFixed(2));

    // 左右脚踏（相位相差 180°）
    const pNear = { x: BB.x + CRANK * Math.cos(crankA), y: BB.y + CRANK * Math.sin(crankA) };
    const pFar  = { x: BB.x - CRANK * Math.cos(crankA), y: BB.y - CRANK * Math.sin(crankA) };
    S.pedalNear.setAttribute("transform", "translate(" + pNear.x.toFixed(2) + " " + pNear.y.toFixed(2) + ")");
    S.pedalFar.setAttribute("transform",  "translate(" + pFar.x.toFixed(2) + " " + pFar.y.toFixed(2) + ")");

    // 身体随踏频起伏（每转两次），头部略微滞后，喉囊轻晃，围巾飘动
    const bob = Math.sin(crankA * 2) * 1.7;
    S.peli.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    S.head.setAttribute("transform", "translate(0 " + (bob * 1.5).toFixed(2) +
      ") rotate(" + (Math.sin(crankA * 2 + 1.1) * 1.3).toFixed(2) + " 486 126)");
    S.pouch.setAttribute("transform", "rotate(" + (Math.sin(crankA - 0.4) * 1.6).toFixed(2) + " 506 134)");
    S.scarfTail.setAttribute("transform", "rotate(" + (Math.sin(t * 3.4) * 7 - 3).toFixed(2) + " 386 180)");

    // 双腿（髋部跟着身体一起上下）
    drawLeg({ x: HIP.x, y: HIP.y + bob }, pNear, S.legNear, 10 * Math.sin(crankA));
    drawLeg({ x: HIP.x - 8, y: HIP.y + bob - 6 }, pFar, S.legFar, 10 * Math.sin(crankA + Math.PI));

    // 地面投影随踩踏轻微呼吸
    S.shadow.setAttribute("rx", (216 + Math.sin(crankA * 2) * 4).toFixed(1));

    // 视差滚动：越近越快
    const wrap = (d) => "translate(" + (-(d * t % TILE)).toFixed(2) + ")";
    S.clouds.setAttribute("transform",    wrap(SPEED * 0.05));
    S.far.setAttribute("transform",       wrap(SPEED * 0.12));
    S.mid.setAttribute("transform",       wrap(SPEED * 0.30));
    S.hedge.setAttribute("transform",     wrap(SPEED * 0.58));
    S.roadMarks.setAttribute("transform", wrap(SPEED * 1.00));
    S.verge.setAttribute("transform",     wrap(SPEED * 1.45));

    S.sun.setAttribute("opacity", (0.9 + Math.sin(t * 0.8) * 0.1).toFixed(3));
  }

  /* ---------- 主循环 ---------- */
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frozen = new URLSearchParams(location.search).get("t");  // ?t=1.2 定格某帧，便于截图核对
  if (reduce || frozen !== null) {
    render(frozen !== null ? (parseFloat(frozen) || 0) : 0);
  } else {
    let last = performance.now(), elapsed = 0;
    requestAnimationFrame(function loop(now) {
      elapsed += Math.min(0.05, (now - last) / 1000);
      last = now;
      render(elapsed);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
