<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #16222a 0%, #3a6073 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    line-height: 0;
  }
  svg { display: block; max-width: 92vw; height: auto; }

  /* 云朵从右往左飘 */
  @keyframes cloudMove {
    from { transform: translateX(880px); }
    to   { transform: translateX(-220px); }
  }
  .cloud-a { animation: cloudMove 38s linear infinite; }
  .cloud-b { animation: cloudMove 55s linear infinite; animation-delay: -26s; }

  /* 路面中线向后滚动（视觉上车子向右前进） */
  @keyframes roadDash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 900; }
  }
  .road-line { animation: roadDash 6.5s linear infinite; }

  /* 路面碎石向后掠过 */
  @keyframes stoneMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }
  .stones { animation: stoneMove .87s linear infinite; }

  /* 速度线：从鹈鹕身后划过并淡出 */
  @keyframes streak {
    0%   { transform: translateX(0);      opacity: 0; }
    15%  { transform: translateX(-30px);  opacity: .65; }
    100% { transform: translateX(-150px); opacity: 0; }
  }
  .streak { animation: streak .8s linear infinite; }
  .streak.s2 { animation-delay: .27s; }
  .streak.s3 { animation-delay: .54s; }

  /* 鹈鹕头部轻微上下点动 */
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(2.2deg); }
  }
  .head-group {
    animation: nod 1.1s ease-in-out infinite;
    transform-origin: 380px 200px;
    transform-box: view-box;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕戴着红色头盔骑自行车">
  <title>鹈鹕骑自行车</title>

  <!-- ============ 背景 ============ -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed0f0"/>
      <stop offset="1" stop-color="#d8f0fb"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="690" cy="78" r="52" fill="#ffd93d" opacity=".35"/>
  <circle cx="690" cy="78" r="34" fill="#ffd93d"/>

  <!-- 云朵 -->
  <g class="cloud-a" opacity=".92">
    <ellipse cx="0" cy="70" rx="48" ry="17" fill="#fff"/>
    <circle cx="-26" cy="62" r="16" fill="#fff"/>
    <circle cx="6" cy="56" r="20" fill="#fff"/>
    <circle cx="32" cy="63" r="14" fill="#fff"/>
  </g>
  <g class="cloud-b" opacity=".8">
    <ellipse cx="0" cy="130" rx="40" ry="14" fill="#fff"/>
    <circle cx="-20" cy="124" r="13" fill="#fff"/>
    <circle cx="8" cy="118" r="16" fill="#fff"/>
  </g>

  <!-- 远山 -->
  <ellipse cx="140" cy="402" rx="190" ry="58" fill="#b5e0a8"/>
  <ellipse cx="430" cy="404" rx="230" ry="44" fill="#a4d693"/>
  <ellipse cx="700" cy="402" rx="200" ry="66" fill="#b5e0a8"/>

  <!-- 草地与公路 -->
  <rect x="0" y="400" width="800" height="55" fill="#5c6670"/>
  <rect x="0" y="455" width="800" height="45" fill="#7ec850"/>
  <rect x="0" y="452" width="800" height="5" fill="#6db23f"/>

  <!-- 公路中线（滚动） -->
  <path class="road-line" d="M0,428 L800,428" stroke="#f5f5f5" stroke-width="5"
        stroke-dasharray="50 40" fill="none"/>

  <!-- 路面碎石（掠过） -->
  <g class="stones" stroke="#7d8790" stroke-width="3" stroke-linecap="round">
    <line x1="30"  y1="447" x2="58"  y2="447"/>
    <line x1="150" y1="443" x2="172" y2="443"/>
    <line x1="270" y1="448" x2="300" y2="448"/>
    <line x1="390" y1="442" x2="412" y2="442"/>
    <line x1="510" y1="447" x2="538" y2="447"/>
    <line x1="630" y1="443" x2="652" y2="443"/>
    <line x1="750" y1="448" x2="778" y2="448"/>
    <line x1="870" y1="443" x2="892" y2="443"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line class="streak"    x1="215" y1="235" x2="278" y2="235"/>
    <line class="streak s2" x1="230" y1="272" x2="300" y2="272"/>
    <line class="streak s3" x1="220" y1="308" x2="285" y2="308"/>
  </g>

  <!-- 车影 -->
  <ellipse cx="395" cy="403" rx="175" ry="9" fill="rgba(0,0,0,.22)"/>

  <!-- ============ 自行车 ============ -->

  <!-- 后轮 -->
  <g>
    <circle cx="285" cy="345" r="55" fill="none" stroke="#2b2b2b" stroke-width="8"/>
    <circle cx="285" cy="345" r="49" fill="none" stroke="#cfd6dc" stroke-width="3"/>
    <g stroke="#9aa4ad" stroke-width="2">
      <line x1="237" y1="345" x2="333" y2="345"/>
      <line x1="285" y1="297" x2="285" y2="393"/>
      <line x1="251" y1="311" x2="319" y2="379"/>
      <line x1="251" y1="379" x2="319" y2="311"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 285 345" to="360 285 345" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <circle cx="285" cy="345" r="6" fill="#444"/>
    <circle cx="285" cy="305" r="2.6" fill="#e74c3c"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="515" cy="345" r="55" fill="none" stroke="#2b2b2b" stroke-width="8"/>
    <circle cx="515" cy="345" r="49" fill="none" stroke="#cfd6dc" stroke-width="3"/>
    <g stroke="#9aa4ad" stroke-width="2">
      <line x1="467" y1="345" x2="563" y2="345"/>
      <line x1="515" y1="297" x2="515" y2="393"/>
      <line x1="481" y1="311" x2="549" y2="379"/>
      <line x1="481" y1="379" x2="549" y2="311"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 515 345" to="360 515 345" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <circle cx="515" cy="345" r="6" fill="#444"/>
    <circle cx="515" cy="305" r="2.6" fill="#e74c3c"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e74c3c" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="395" y1="350" x2="352" y2="258"/>   <!-- 座管 -->
    <line x1="358" y1="266" x2="482" y2="268"/>   <!-- 上管 -->
    <line x1="395" y1="350" x2="490" y2="308"/>   <!-- 下管 -->
    <line x1="480" y1="262" x2="496" y2="312"/>   <!-- 头管 -->
    <line x1="496" y1="312" x2="515" y2="345" stroke="#b03a2e"/> <!-- 前叉 -->
    <line x1="358" y1="268" x2="285" y2="345"/>   <!-- 后上叉 -->
    <line x1="395" y1="350" x2="285" y2="345" stroke="#b03a2e"/> <!-- 后下叉 -->
  </g>
  <!-- 车把 -->
  <path d="M482,266 L474,244" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M460,248 Q468,236 480,250" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- 车座 -->
  <path d="M330,256 Q352,244 378,256 Q354,262 330,256 Z" fill="#2b2b2b"/>

  <!-- 链条与牙盘 -->
  <g stroke="#555" stroke-width="2.5" fill="none">
    <line x1="285" y1="340" x2="395" y2="338" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="285" y1="352" x2="395" y2="363" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="395" cy="350" r="14" stroke-width="3"/>
    <circle cx="395" cy="350" r="4" fill="#555"/>
  </g>

  <!-- ============ 鹈鹕的双腿（踩踏板，路径动画） ============ -->
  <!-- 远侧腿 -->
  <path fill="none" stroke="#d98e26" stroke-width="9" stroke-linecap="round" d="M352,238 Q380,292 365,350">
    <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M352,238 Q380,292 365,350;
              M352,238 Q389,277 374,329;
              M352,238 Q398,266 395,320;
              M352,238 Q402,271 416,329;
              M352,238 Q401,286 425,350;
              M352,238 Q394,300 416,371;
              M352,238 Q384,306 395,380;
              M352,238 Q377,302 374,371;
              M352,238 Q380,292 365,350"/>
  </path>
  <!-- 近侧腿 -->
  <path fill="none" stroke="#f5a623" stroke-width="9" stroke-linecap="round" d="M352,238 Q401,286 425,350">
    <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
      values="M352,238 Q401,286 425,350;
              M352,238 Q394,300 416,371;
              M352,238 Q384,306 395,380;
              M352,238 Q377,302 374,371;
              M352,238 Q380,292 365,350;
              M352,238 Q389,277 374,329;
              M352,238 Q398,266 395,320;
              M352,238 Q402,271 416,329;
              M352,238 Q401,286 425,350"/>
  </path>

  <!-- 曲柄 + 踏板 + 蹼足（踏板反向自转保持水平） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 395 350" to="360 395 350" dur="1.1s" repeatCount="indefinite"/>
    <line x1="395" y1="350" x2="425" y2="350" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="350" x2="365" y2="350" stroke="#333" stroke-width="5" stroke-linecap="round"/>

    <g><!-- 前踏板 -->
      <animateTransform attributeName="transform" type="rotate"
        from="0 425 350" to="-360 425 350" dur="1.1s" repeatCount="indefinite"/>
      <rect x="412" y="347" width="26" height="7" rx="2" fill="#333"/>
      <path d="M409,348 Q413,340 425,341 Q437,342 445,347 L443,350 Q425,352 409,351 Z"
            fill="#f5a623" stroke="#333" stroke-width="1.5"/>
    </g>
    <g><!-- 后踏板 -->
      <animateTransform attributeName="transform" type="rotate"
        from="0 365 350" to="-360 365 350" dur="1.1s" repeatCount="indefinite"/>
      <rect x="352" y="347" width="26" height="7" rx="2" fill="#2a2a2a"/>
      <path d="M349,348 Q353,340 365,341 Q377,342 385,347 L383,350 Q365,352 349,351 Z"
            fill="#e0912a" stroke="#333" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ============ 鹈鹕身体 ============ -->
  <!-- 尾羽 -->
  <path d="M298,192 L258,172 L272,196 L256,206 L276,214 L296,218 Z"
        fill="#fdf6e3" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 身体 -->
  <ellipse cx="340" cy="205" rx="55" ry="40" transform="rotate(-8 340 205)"
           fill="#fdf6e3" stroke="#333" stroke-width="2.5"/>
  <!-- 翅膀（收在身侧） -->
  <ellipse cx="336" cy="212" rx="30" ry="18" transform="rotate(-14 336 212)"
           fill="#efe4c8" stroke="#333" stroke-width="2"/>

  <!-- 头颈组（轻微点动） -->
  <g class="head-group">
    <!-- 脖子（先描边再填色） -->
    <path d="M372,200 Q400,198 413,170 Q423,148 430,128"
          fill="none" stroke="#333" stroke-width="19" stroke-linecap="round"/>
    <path d="M372,200 Q400,198 413,170 Q423,148 430,128"
          fill="none" stroke="#fdf6e3" stroke-width="15" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="433" cy="118" r="17" fill="#fdf6e3" stroke="#333" stroke-width="2.5"/>
    <!-- 大嘴与喉囊 -->
    <path d="M442,126 Q448,166 494,139 Q466,150 442,132 Z"
          fill="#f08c2e" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
    <path d="M441,112 L497,138 L441,127 Z"
          fill="#f5a623" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
    <!-- 眼睛 -->
    <circle cx="439" cy="111" r="3.4" fill="#222"/>
    <circle cx="440" cy="110" r="1.1" fill="#fff"/>
    <!-- 红色头盔 -->
    <path d="M414,116 A19,19 0 0 1 452,114 Z" fill="#e74c3c" stroke="#333" stroke-width="2"/>
    <path d="M416,105 Q433,94 451,104" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 翅膀扶在车把上 -->
  <path d="M365,198 Q420,230 458,248"
        fill="none" stroke="#333" stroke-width="15" stroke-linecap="round"/>
  <path d="M365,198 Q420,230 458,248"
        fill="none" stroke="#efe4c8" stroke-width="11" stroke-linecap="round"/>
</svg>
</div>
</body>
</html>
