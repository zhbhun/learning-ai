<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --crank: 1.8s;     /* 曲柄转一圈 */
    --wheel: 1.25s;    /* 车轮转一圈：牙盘 26 / 飞轮 18 → 1.44 圈每踏 */
    --road:  1.61s;    /* 路面：600px 周期 */
    --pole:  1.24s;    /* 电线杆 / 灌木：460px 周期 */
    --hill:  5.4s;     /* 远山：700px 周期，视差更慢 */
    --cloud: 11s;      /* 云：620px 周期 */
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-content:center; gap:16px; padding:30px 16px;
    background:radial-gradient(130% 120% at 50% 0%, #14273f 0%, #060b16 72%);
    font-family:-apple-system,"PingFang SC","Helvetica Neue",system-ui,sans-serif; color:#cfe0f5;
  }
  .frame{ width:min(1000px,96vw); border-radius:20px; overflow:hidden;
    box-shadow:0 30px 70px -22px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08) }
  svg{ display:block; width:100%; height:auto }
  .bar{ width:min(1000px,96vw); display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    font-size:12.5px; letter-spacing:.08em; color:#8ba4c4 }
  .bar b{ color:#f2f7ff; font-weight:600; letter-spacing:.22em }
  .play{ display:flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px;
    background:rgba(255,255,255,.08); cursor:pointer; user-select:none }
  .play input{ width:15px; height:15px; accent-color:#f0a83c; cursor:pointer }
  body:has(#pause:checked) svg *{ animation-play-state:paused }

  /* ---------- 动画节点：以 viewBox 坐标为原点 ---------- */
  .an{ transform-box:view-box; transform-origin:0 0 }
  .tail      { transform-origin:318px 208px }
  .head      { transform-origin:400px 190px }
  .pouch     { transform-origin:490px 126px }
  .wing-near { transform-origin:368px 196px }
  .wing-far  { transform-origin:366px 186px }
  .rays      { transform-origin:742px 86px }

  /* ---------- 动画绑定 ---------- */
  .wheel-a,.wheel-b,.cog { animation:roll linear infinite var(--wheel) }
  .crank-near{ animation:crank-a linear infinite var(--crank) }
  .crank-far { animation:crank-b linear infinite var(--crank) }
  .pedal-near{ animation:level-a linear infinite var(--crank) }
  .pedal-far { animation:level-b linear infinite var(--crank) }
  .thigh-near{ animation:thigh-a linear infinite var(--crank) }
  .shin-near { animation:shin-a  linear infinite var(--crank) }
  .foot-near { animation:foot-a  linear infinite var(--crank) }
  .thigh-far { animation:thigh-b linear infinite var(--crank) }
  .shin-far  { animation:shin-b  linear infinite var(--crank) }
  .foot-far  { animation:foot-b  linear infinite var(--crank) }
  .rider     { animation:bob ease-in-out infinite calc(var(--crank) / 2) }
  .head      { animation:nod ease-in-out infinite var(--crank) }
  .pouch     { animation:sag ease-in-out infinite calc(var(--crank) / 2) }
  .tail      { animation:wag ease-in-out infinite calc(var(--crank) * 1.4) }
  .wing-near { animation:hold ease-in-out infinite calc(var(--crank) / 2) }
  .wing-far  { animation:flap ease-in-out infinite calc(var(--crank) * .6) }
  .l-road { animation:road-600  linear infinite var(--road) }
  .l-pole { animation:pole-460  linear infinite var(--pole) }
  .l-shrub{ animation:pole-460  linear infinite var(--pole) }
  .l-hill { animation:hill-700  linear infinite var(--hill) }
  .l-cloud{ animation:cloud-620 linear infinite var(--cloud) }
  .streak { opacity:0; animation:whoosh linear infinite 1.3s }
  .streak.b{ animation-duration:1.75s; animation-delay:-.4s }
  .streak.c{ animation-duration:1.05s; animation-delay:-.7s }
  .gull   { animation:fly linear infinite 15s }
  .gull.b { animation-duration:21s; animation-delay:-8s }
  .rays   { animation:roll linear infinite 46s }

  @keyframes roll   { to{ transform:rotate(360deg) } }
  @keyframes bob    { 0%,100%{transform:translate(0,-1px)} 50%{transform:translate(-2px,3px)} }
  @keyframes nod    { 0%,100%{transform:rotate(-1.8deg)} 50%{transform:rotate(2.2deg)} }
  @keyframes sag    { 0%,100%{transform:scale(1,1)} 50%{transform:translateY(2px) scale(1.02,1.1)} }
  @keyframes wag    { 0%,100%{transform:rotate(-3.5deg)} 50%{transform:rotate(4.5deg)} }
  @keyframes hold   { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2deg)} }
  @keyframes flap   { 0%,100%{transform:rotate(10deg)} 50%{transform:rotate(-12deg)} }
  @keyframes whoosh { 0%{opacity:0; transform:translateX(60px)} 22%{opacity:.8} 100%{opacity:0; transform:translateX(-210px)} }
  @keyframes fly    { to{ transform:translate(-1080px,-30px) } }
  @keyframes road-600 { to{ transform:translateX(-600px) } }
  @keyframes pole-460 { to{ transform:translateX(-460px) } }
  @keyframes hill-700 { to{ transform:translateX(-700px) } }
  @keyframes cloud-620{ to{ transform:translateX(-620px) } }

<body>
<div class="frame">
  <svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车行进的二维动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#79c6ef"/><stop offset=".55" stop-color="#c9ecf7"/><stop offset="1" stop-color="#fdeecf"/>
      </linearGradient>
