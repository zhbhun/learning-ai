<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · 2D SVG 动画</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; padding: 24px; background: #101a2e; font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif; }
  .scene-card { width: min(960px, 100%); overflow: hidden; border-radius: 28px; background: #f9e4be; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
  .scene-wrap { position: relative; aspect-ratio: 16 / 10; }
  svg { display: block; width: 100%; height: 100%; }
  .caption { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px 17px; color: #16324f; background: #fff5df; font-size: 14px; letter-spacing: .02em; }
  .caption strong { font-size: 17px; }
  .caption span { opacity: .72; }
  button { border: 0; border-radius: 999px; padding: 9px 15px; cursor: pointer; color: #fff5df; background: #ee6c4d; font: inherit; font-weight: 700; transition: transform .2s ease, background .2s ease; }
  button:hover { transform: translateY(-1px); background: #d9553c; }
  button:focus-visible { outline: 3px solid #f8c96a; outline-offset: 3px; }
  .cloud { animation: drift 24s linear infinite; }
  .cloud.slow { animation-duration: 34s; animation-delay: -9s; }
  .wave { animation: wave 4s ease-in-out infinite; transform-origin: center; }
  .wave:nth-child(2) { animation-delay: -1.3s; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
  .bike-bob { animation: bob .9s ease-in-out infinite; transform-origin: 50% 80%; }
  .pedal-arm { animation: pedal .9s linear infinite; transform-origin: 50% 50%; }
  .wing { animation: flap 1.8s ease-in-out infinite; transform-origin: 55% 75%; }
  .head { animation: head-bob .9s ease-in-out infinite; transform-origin: 50% 100%; }
  .feather { animation: feather 1.8s ease-in-out infinite; transform-origin: 0 100%; }
  .ground-dash { animation: road 1.1s linear infinite; }
  .sparkle { animation: twinkle 2.6s ease-in-out infinite; }
  .sparkle:nth-child(2) { animation-delay: -1.2s; }
  .sparkle:nth-child(3) { animation-delay: -.5s; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(1000px); } }
  @keyframes wave { 0%,100% { transform: translateX(0); opacity: .55; } 50% { transform: translateX(14px); opacity: .9; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-5px) rotate(.5deg); } }
  @keyframes pedal { to { transform: rotate(360deg); } }
  @keyframes flap { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-7deg) translateY(-3px); } }
  @keyframes head-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes feather { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }
  @keyframes road { to { transform: translateX(-96px); } }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
  .paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<main class="scene-card" aria-label="鹈鹕骑自行车的 SVG 2D 动画">
<div class="scene-wrap" id="scene">
<svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">海边的鹈鹕骑自行车</title>
<desc id="desc">一只戴着小帽子的鹈鹕踩着自行车沿着海边前进，云朵、海浪和道路都在循环动画。</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8c96a"/><stop offset=".56" stop-color="#f49b78"/><stop offset="1" stop-color="#e87367"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58b8c1"/><stop offset="1" stop-color="#207c9b"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#47637a"/><stop offset="1" stop-color="#253a54"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="960" height="600" fill="url(#sky)"/>
<circle cx="760" cy="122" r="68" fill="#ffe9a6" opacity=".68"/><circle cx="760" cy="122" r="92" fill="none" stroke="#ffe9a6" stroke-width="3" opacity=".24"/>
<g class="cloud" fill="#fff7df" opacity=".8"><path d="M-55 150c20-27 53-29 75-6 18-28 63-25 74 12 35-11 68 10 69 40H-63c-11-17-7-33 8-46z"/></g>
<g class="cloud slow" fill="#fff7df" opacity=".62"><path d="M715 205c18-24 48-25 67-6 17-26 57-23 68 11 30-10 59 9 60 36H704c-9-15-6-29 11-41z"/></g>
<path d="M0 312 Q120 286 240 312 T480 312 T720 312 T960 312 V600H0Z" fill="#2b8fa2" opacity=".28"/><rect y="322" width="960" height="278" fill="url(#sea)"/>
<g fill="none" stroke="#a8e6dd" stroke-linecap="round" opacity=".7"><path class="wave" d="M45 383c35-17 72-17 108 0s74 17 110 0" stroke-width="5"/><path class="wave" d="M580 420c35-17 72-17 108 0s74 17 110 0" stroke-width="5"/><path class="wave" d="M10 500c35-17 72-17 108 0s74 17 110 0" stroke-width="4"/><path class="wave" d="M708 535c35-17 72-17 108 0s74 17 110 0" stroke-width="4"/></g>
<path d="M0 426 Q170 394 355 425 T720 424 T960 420 V600H0Z" fill="#e8bf79"/><path d="M0 472 Q160 442 330 470 T650 469 T960 462 V600H0Z" fill="url(#road)"/>
<g class="ground-dash" fill="#edc673" opacity=".85"><rect x="-20" y="527" width="58" height="8" rx="4"/><rect x="105" y="527" width="58" height="8" rx="4"/><rect x="230" y="527" width="58" height="8" rx="4"/><rect x="355" y="527" width="58" height="8" rx="4"/><rect x="480" y="527" width="58" height="8" rx="4"/><rect x="605" y="527" width="58" height="8" rx="4"/><rect x="730" y="527" width="58" height="8" rx="4"/><rect x="855" y="527" width="58" height="8" rx="4"/></g>
<g class="sparkle" fill="#fff1b6"><path d="M184 228l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/></g><g class="sparkle" fill="#fff1b6"><path d="M852 285l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g><g class="sparkle" fill="#fff1b6"><path d="M274 108l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/></g>
<ellipse cx="485" cy="493" rx="204" ry="25" fill="#152b43" opacity=".3" filter="url(#shadow)"/>
<g class="bike-bob">
<g fill="none" stroke="#f8df9b" stroke-width="8"><circle class="wheel" cx="370" cy="476" r="61"/><circle class="wheel" cx="603" cy="476" r="61"/><path d="M370 476l80-101 72 101h-152l72-101 79 101"/><path d="M450 375l-9-29h-27" stroke-linecap="round"/><path d="M522 476l15-111h30" stroke-linecap="round"/></g>
<g fill="none" stroke="#f8df9b" stroke-width="3" opacity=".75"><path d="M370 415v122M309 476h122M327 433l86 86M327 519l86-86"/><path d="M603 415v122M542 476h122M560 433l86 86M560 519l86-86"/></g><circle cx="522" cy="476" r="12" fill="#ee6c4d" stroke="#f8df9b" stroke-width="5"/><g class="pedal-arm" stroke="#ee6c4d" stroke-width="6" stroke-linecap="round"><path d="M522 476l-20 18M522 476l24-16"/><path d="M492 499h-18M548 457h18"/></g>
<g class="feather" stroke="#16324f" stroke-width="5" stroke-linejoin="round"><path d="M463 370c-9-57 13-100 65-115 44-12 83 18 76 70-5 37-26 57-60 63z" fill="#f5ead2"/><path d="M520 370c-5-49 15-91 54-105 14 16 17 37 10 57-8 26-25 40-64 48z" fill="#e5c99b" stroke="none"/><path d="M475 390c17-35 31-43 61-39 35 5 48 28 54 62l-38 20-72-17z" fill="#fff6df"/><path d="M509 421c-20 18-26 32-29 52M553 420c19 16 27 31 28 53" fill="none" stroke="#ee6c4d" stroke-width="10" stroke-linecap="round"/><path d="M491 444l30-22 30 19-23 32-34-8z" fill="#3c8eaa"/><path d="M518 374c-14 20-23 34-27 46M568 370c10 24 15 36 20 48" fill="none" stroke="#f1cf74" stroke-width="12" stroke-linecap="round"/><path d="M493 351c-16 15-29 26-45 32" fill="none" stroke="#f5ead2" stroke-width="18" stroke-linecap="round"/><path class="wing" d="M495 350c-34 8-51 26-49 56 30-6 52-26 64-51z" fill="#e8cba1"/></g>
<g class="head" stroke="#16324f" stroke-width="5" stroke-linejoin="round"><path d="M512 268c-5-39 21-66 59-67 38-1 61 29 50 64-8 28-32 42-62 39-25-3-43-15-47-36z" fill="#f5ead2"/><path d="M561 202c13-25 48-26 64-8-7 12-18 18-34 19z" fill="#ee6c4d"/><path d="M615 258c22-1 51 3 83 19 8 4 7 14-1 17-29 10-54 13-82 4z" fill="#e69a53"/><path d="M622 274c25 2 48 6 70 12-29 11-49 12-72 7z" fill="#f1bf68" stroke="none"/><circle cx="591" cy="247" r="7" fill="#16324f" stroke="none"/><circle cx="594" cy="244" r="2" fill="#fff" stroke="none"/></g>
<path d="M641 265c18 3 32 7 45 12" fill="none" stroke="#b85f3a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</g>
</svg>
</div>
<div class="caption"><div><strong>海风骑行日</strong><br><span>Pelican on two wheels · SVG motion study</span></div><button id="toggle" type="button" aria-pressed="false">暂停动画</button></div>
</main>
<script>
const scene = document.getElementById('scene');
const toggle = document.getElementById('toggle');
toggle.addEventListener('click', () => { const paused = scene.classList.toggle('paused'); toggle.textContent = paused ? '继续动画' : '暂停动画'; toggle.setAttribute('aria-pressed', String(paused)); });
</script>
</body>
</html>
