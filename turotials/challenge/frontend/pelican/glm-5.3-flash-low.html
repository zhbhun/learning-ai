<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(#aee3f7 0%, #d8f1fb 60%, #f6f9d8 60%, #eef3c2 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee3f7"/>
      <stop offset="100%" stop-color="#e6f7ff"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="800" cy="70" r="38" fill="#ffd54a"/>
  <circle cx="800" cy="70" r="50" fill="#ffd54a" opacity="0.3">
    <animate attributeName="r" values="50;58;50" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云（向左飘） -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="80" rx="45" ry="18"/>
      <ellipse cx="185" cy="70" rx="35" ry="15"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-950 0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="500" cy="120" rx="55" ry="20"/>
      <ellipse cx="545" cy="110" rx="40" ry="16"/>
      <animateTransform attributeName="transform" type="translate" from="450 0" to="-500 0" dur="55s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远处小山 -->
  <path d="M0 340 Q150 240 300 340 Z" fill="#bfe3a8"/>
  <path d="M220 340 Q400 220 580 340 Z" fill="#a9d68f"/>
  <path d="M520 340 Q700 250 900 340 Z" fill="#bfe3a8"/>

  <!-- 地面 -->
  <rect x="0" y="340" width="900" height="160" fill="#8fce6e"/>
  <!-- 路面 -->
  <rect x="0" y="395" width="900" height="40" fill="#7a8aa0"/>
  <rect x="0" y="395" width="900" height="6" fill="#68778c"/>

  <!-- 路面虚线（向左移动，营造前进感） -->
  <g stroke="#f2f2e6" stroke-width="6" stroke-dasharray="40 50">
    <line x1="0" y1="415" x2="900" y2="415">
      <animate attributeName="x1" from="0" to="-90" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="900" to="810" dur="0.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 路边的小树（向左移动） -->
  <g>
    <g transform="translate(950,0)">
      <rect x="-6" y="330" width="12" height="45" fill="#8a5a33"/>
      <circle cx="0" cy="315" r="26" fill="#4f9e4f"/>
      <circle cx="-14" cy="325" r="16" fill="#5cae5c"/>
      <circle cx="14" cy="325" r="16" fill="#5cae5c"/>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <g>
    <g transform="translate(1450,0)">
      <rect x="-6" y="330" width="12" height="45" fill="#8a5a33"/>
      <circle cx="0" cy="315" r="26" fill="#4f9e4f"/>
      <circle cx="-14" cy="325" r="16" fill="#5cae5c"/>
      <circle cx="14" cy="325" r="16" fill="#5cae5c"/>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- ============ 自行车 ============ -->
  <g id="bike" transform="translate(0,0)">
    <!-- 车身整体轻微颠簸 -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="0.35s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g transform="translate(320,400)">
      <circle r="42" fill="none" stroke="#333" stroke-width="7"/>
      <circle r="36" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="2">
        <line x1="0" y1="-36" x2="0" y2="36"/>
        <line x1="-36" y1="0" x2="36" y2="0"/>
        <line x1="-25" y1="-25" x2="25" y2="25"/>
        <line x1="-25" y1="25" x2="25" y2="-25"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
      </g>
      <circle r="5" fill="#333"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(540,400)">
      <circle r="42" fill="none" stroke="#333" stroke-width="7"/>
      <circle r="36" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="2">
        <line x1="0" y1="-36" x2="0" y2="36"/>
        <line x1="-36" y1="0" x2="36" y2="0"/>
        <line x1="-25" y1="-25" x2="25" y2="25"/>
        <line x1="-25" y1="25" x2="25" y2="-25"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
      </g>
      <circle r="5" fill="#333"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M320 400 L390 320 L500 320"/>
      <path d="M320 400 L430 400 L390 320"/>
      <path d="M430 400 L500 320"/>
      <path d="M500 320 L540 400"/>
      <line x1="500" y1="320" x2="492" y2="300"/>
    </g>
    <!-- 车座 -->
    <path d="M370 312 q20 -10 40 0 q-20 8 -40 0 Z" fill="#333"/>
    <!-- 车把 -->
    <path d="M492 300 q-4 -18 14 -24" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>
    <line x1="486" y1="272" x2="514" y2="272" stroke="#333" stroke-width="8" stroke-linecap="round"/>

    <!-- 曲柄与踏板（旋转） -->
    <g transform="translate(430,400)">
      <circle r="10" fill="#555"/>
      <g>
        <line x1="0" y1="0" x2="0" y2="-26" stroke="#333" stroke-width="5"/>
        <line x1="0" y1="0" x2="0" y2="26" stroke="#333" stroke-width="5"/>
        <rect x="-11" y="-34" width="22" height="8" rx="3" fill="#222"/>
        <rect x="-11" y="26" width="22" height="8" rx="3" fill="#222"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <g id="pelican">
      <!-- 腿部（两条，随曲柄蹬踏，用摆动近似踩踏动作） -->
      <g stroke="#e8862e" stroke-width="9" fill="none" stroke-linecap="round">
        <line x1="415" y1="330" x2="430" y2="385">
          <animate attributeName="x2" values="430;444;430;416;430" dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="385;392;385;378;385" dur="0.7s" repeatCount="indefinite"/>
        </line>
        <line x1="425" y1="330" x2="430" y2="412">
          <animate attributeName="x2" values="430;416;430;444;430" dur="0.7s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="412;404;412;420;412" dur="0.7s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- 脚蹼 -->
      <path d="M430 385 l16 -3 l-4 8 Z" fill="#e8862e">
        <animate attributeName="transform" attributeType="XML" type="translate" values="0 0; 14 7; 0 0; -14 -7; 0 0" dur="0.7s" repeatCount="indefinite"/>
      </path>
      <path d="M430 412 l16 -3 l-4 8 Z" fill="#e8862e">
        <animate attributeName="transform" attributeType="XML" type="translate" values="0 0; -14 -7; 0 0; 14 7; 0 0" dur="0.7s" repeatCount="indefinite"/>
      </path>

      <!-- 身体（椭圆，白色） -->
      <ellipse cx="405" cy="290" rx="48" ry="42" fill="#fdfdf5" stroke="#d8d8c8" stroke-width="2"/>
      <!-- 尾羽 -->
      <path d="M362 275 q-28 -12 -40 4 q16 8 30 10 Z" fill="#ececdf"/>
      <!-- 翅膀（搭在车把方向） -->
      <path d="M400 275 q55 -5 88 -5 q-10 16 -40 22 q-30 6 -48 -17 Z" fill="#f1f1e2" stroke="#d8d8c8" stroke-width="2"/>

      <!-- 脖子与头（轻微上下摆动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 420 250; 2 420 250; -2 420 250" dur="1.4s" repeatCount="indefinite"/>
        <path d="M420 270 q20 -40 12 -75 q-4 -22 14 -28" stroke="#fdfdf5" stroke-width="22" fill="none" stroke-linecap="round"/>
        <!-- 头 -->
        <circle cx="448" cy="165" r="26" fill="#fdfdf5" stroke="#d8d8c8" stroke-width="2"/>
        <!-- 大嘴（喙 + 喉囊） -->
        <path d="M468 160 l52 8 q2 4 -2 6 l-50 -2 Z" fill="#f5a623"/>
        <path d="M468 168 q10 26 34 22 q14 -4 16 -14 l-50 -8 Z" fill="#f7b955"/>
        <!-- 眼睛 -->
        <circle cx="446" cy="158" r="4.5" fill="#222"/>
        <circle cx="447.5" cy="156.5" r="1.5" fill="#fff"/>
        <!-- 头顶小羽冠 -->
        <path d="M432 142 q-6 -14 4 -20 q0 10 8 14 Z" fill="#ececdf"/>
      </g>
    </g>
  </g>

  <!-- 标题 -->
  <text x="450" y="470" text-anchor="middle" font-size="22" fill="#3c5a2e" font-weight="bold">🚲 鹈鹕骑自行车 Pelican on a Bike</text>
</svg>
</body>
</html>
